# On-screen text — the channel signature. Versioned in full: this outlives
# any episode, and a record re-derived from memory in a year with a different
# rate or a different click is a different channel.
#
# One renderer, one font, every character on screen. Cards, titles, thumbnail
# plates and channel art all come through here.

font:
  face: /System/Library/Fonts/Menlo.ttc
  name: Menlo
  size: 40                  # body size at 1080p; a card may not go smaller
  tracking: 3               # px between glyphs, at size 40
  # Phosphor green, off an analogue monitor. The first build was off-white at
  # size 26 and disappeared into a salt pan: pale text on pale ground has no
  # colour separation to fall back on, only luminance, and this world is all
  # luminance. Green owns a channel nothing in this landscape uses.
  colour: [150, 255, 190]
  alpha: 235

  # Legibility on any plate, light or dark, without a scrim or a box. Three
  # layers, in this order:
  #   halo  — a blurred black silhouette, which is what holds the text on a
  #           bright salt pan
  #   glow  — a blurred copy of the text itself, which is the phosphor bloom
  #   sharp — the glyphs
  halo_radius: 9
  halo_alpha: 170
  glow_radius: 7
  glow_alpha: 150
  # Titles sit under the grain pass, never over it. See CLAUDE.md, Post.

typing:
  # Characters arrive one at a time, as if over a slow link. Not a fade, not
  # a slide, not a bouncing typewriter — the glyph is simply there on the
  # next frame.
  chars_per_second: 18
  jitter: 0.15              # +/- fraction of the interval, so it is not a metronome
  line_pause_seconds: 0.35  # after a line completes, before the next begins
  # A card never leaves the screen less than this after its last character.
  # Record 02's first build set an explicit hold_until per card and three of
  # the six were cut off mid-word by it — the hold was written before anyone
  # knew how long the text took to type. The floor is the rule; hold_until
  # can only extend it, never shorten it.
  hold_after_seconds: 2.0
  cursor: none              # no block cursor, no underscore, nothing blinking
  # A line resolves and then holds for its own hold time; it never re-types.

click:
  # Synthesised locally, never sampled and never generated by a model, so it
  # is byte-identical between episodes.
  source: synth
  waveform: filtered_noise  # short noise burst through a band-pass
  centre_hz: 2100
  bandwidth_hz: 900
  attack_ms: 1
  decay_ms: 28
  level_dbfs: -26           # under the narration, never over it
  pitch_jitter: 0.06        # tiny variation so a long line does not machine-gun
  per: character            # one click per glyph; spaces are silent
  counters: digit_change    # an odometer or a draining bar ticks per digit

# Where this applies. Everything, deliberately.
applies_to:
  - episode data cards        # cards.yaml
  - episode titles and slug   # titles.yaml
  - closing cards
  - thumbnail plates          # thumbnails.yaml
  - channel art               # brand.yaml
