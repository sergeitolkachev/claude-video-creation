# On-screen text — the channel signature. Versioned in full: this outlives
# any episode, and a record re-derived from memory in a year with a different
# rate or a different click is a different channel.
#
# One renderer, one font, every character on screen. Cards, titles, thumbnail
# plates and channel art all come through here.

font:
  face: /System/Library/Fonts/Menlo.ttc
  name: Menlo
  size: 40                  # body size at 1080p; a card may not go smaller
  tracking: 3               # px between glyphs, at size 40
  # Phosphor green, off an analogue monitor. The first build was off-white at
  # size 26 and disappeared into a salt pan: pale text on pale ground has no
  # colour separation to fall back on, only luminance, and this world is all
  # luminance. Green owns a channel nothing in this landscape uses.
  colour: [150, 255, 190]
  alpha: 235

  # Legibility on any plate, light or dark, without a scrim or a box. Three
  # layers, in this order:
  #   halo  — a blurred black silhouette, which is what holds the text on a
  #           bright salt pan
  #   glow  — a blurred copy of the text itself, which is the phosphor bloom
  #   sharp — the glyphs
  halo_radius: 9
  halo_alpha: 170
  glow_radius: 7
  glow_alpha: 150
  # Titles sit under the grain pass, never over it. See CLAUDE.md, Post.

typing:
  # Characters arrive one at a time, as if over a slow link. Not a fade, not
  # a slide, not a bouncing typewriter — the glyph is simply there on the
  # next frame.
  chars_per_second: 18
  jitter: 0.15              # +/- fraction of the interval, so it is not a metronome
  line_pause_seconds: 0.35  # after a line completes, before the next begins
  # A card never leaves the screen less than this after its last character.
  # Record 02's first build set an explicit hold_until per card and three of
  # the six were cut off mid-word by it — the hold was written before anyone
  # knew how long the text took to type. The floor is the rule; hold_until
  # can only extend it, never shorten it.
  hold_after_seconds: 2.0
  cursor: none              # no block cursor, no underscore, nothing blinking
  # A line resolves and then holds for its own hold time; it never re-types.

click:
  # Synthesised locally, never sampled and never generated by a model, so it
  # is byte-identical between episodes.
  source: synth
  waveform: filtered_noise  # short noise burst through a band-pass
  centre_hz: 2100
  bandwidth_hz: 900
  attack_ms: 1
  decay_ms: 28
  level_dbfs: -26           # under the narration, never over it
  pitch_jitter: 0.06        # tiny variation so a long line does not machine-gun
  per: character            # one click per glyph; spaces are silent
  counters: digit_change    # an odometer or a draining bar ticks per digit

# Where this applies. Everything, deliberately.
applies_to:
  - episode data cards        # cards.yaml
  - episode titles and slug   # titles.yaml
  - closing cards
  - thumbnail plates          # thumbnails.yaml
  - channel art               # brand.yaml

# --- Captions, on the vertical cuts -----------------------------------------
#
# Captions are speech, not instrumentation: they stay neutral off-white rather
# than phosphor, because phosphor is what the record's own readouts are drawn
# in and a subtitle is not a readout. Same Menlo, same halo, no box — a box
# reads as a player overlay.
#
# The block grows upward from a fixed clear space at the bottom, so adding a
# second line never eats into it. That space exists because every vertical
# platform parks its own furniture there: the caption, the handle, the sound
# name, the buttons. Record 01 left 264 px of 1920 clear and it was still
# under the pile.
captions:
  size: 46
  tracking: 1.5
  line_height: 66
  colour: [240, 238, 232]
  alpha: 250
  halo_radius: 10
  halo_alpha: 220
  safe_width: 900           # of 1080; a real margin, not the frame edge
  bottom_clear: 0.30        # fraction of frame height kept clear underneath
  line_chars: 30
  cue_chars: 58

  # A scrim under the caption block, because a halo alone is not a guarantee.
  #
  # The halo is the shape of the glyphs and it holds type over most plates. It
  # does not hold it over all of them: record 03's verticals run over a lit
  # grating, a white sheet of paper under a work lamp and a phosphor screen,
  # and a caption has to be legible on every frame of every cut without anyone
  # checking frame by frame.
  #
  # This is NOT a box. A box has edges, and edges read as a player overlay
  # rather than as part of the recording — which is why the channel refused one
  # in the first place. This is a soft vertical gradient, transparent at the
  # top and darkest at the bottom of the caption band, feathered over 180 px so
  # it has no boundary anywhere. On a dark plate it is invisible; on a bright
  # one it is the only reason the type survives.
  # The card every vertical closes on. Same text, same length, every cut and
  # every episode — furniture, like the slug. The channel asks for one thing
  # and it asks once, at the end, after the viewer has already stayed.
  end_card:
    # Two lines, not one. On one line this is 36 characters, which at Menlo 46
    # with the channel's tracking is about 1100 px — wider than the 1080 px
    # frame, never mind the 900 px safe width. The first build shipped it
    # clipped at both ends. The renderer now shrinks to fit as a last resort,
    # but the right answer is to break the line where the sentence breaks.
    lines:
      - "WATCH THE FULL RECORD"
      - "ON THE CHANNEL"
    seconds: 2.0
    size: 46
    tracking: 3

  scrim_alpha: 110          # darkest point, 0-255
  scrim_feather: 180        # px of fade above the block, so there is no edge
  scrim_pad: 28             # px of scrim below the last line; the whole
                            # block is lifted by this, so the gradient ends
                            # ON the clear line rather than inside it
