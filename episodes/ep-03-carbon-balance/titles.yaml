# Burned-in titles — channel furniture only. The episode's data graphics are
# in cards.yaml; these are the slug and the closing block, in the same Menlo,
# the same phosphor, the same corner as every other record.
#
# Times are absolute seconds on the 220 s timeline. A title is not tied to a
# plate the way a data card is — the slug belongs to the record, not to the
# shot it happens to land on — so these stay absolute. Shot boundaries, for
# reading these numbers against:
#
#   1.1   0–5      1.2   5–13     1.3  13–22
#   7.1 177–183    7.2 183–193    7.3 193–220  (the closing block)
#
# Rendered by build_cards.py --titles.

cards:
  # The slug types itself into the corner over the opening shot and is gone
  # before the cut. Record 3 opens on the fan, not on a title: image first,
  # no ident, no title sequence. The slug is furniture, not an opening.
  - id: slug
    at: 0.8
    hold: 4.0
    lines: ["FC9-003 // CARBON BALANCE"]

  # --- Close ---------------------------------------------------------------
  # Four record cards and then the channel closer. Room tone only under all of
  # them — the scrubber fan cuts on the first card, which is the point of
  # having established it in scene 1 and taken it away in scene 3.
  #
  # The click track stays: these are characters arriving on a monitor like
  # every other character on the channel. The fan is what goes.
  #
  # Five cards, not the draft's five record cards: THE RECORD CONTINUES TO LOG
  # 129 was cut because the card after it says the same thing and says it
  # better by implication.
  - id: close-1
    at: 193.0
    hold: 4.0
    lines: ["DOUBLING TIME: 17.8 DAYS"]

  - id: close-2
    at: 197.0
    hold: 5.0
    lines: ["SECTION D OUTPUT REACHES 1.00 kg/day IN 22 DAYS"]

  - id: close-3
    at: 202.0
    hold: 5.0
    lines: ["SCRUBBER CAPACITY IS EXCEEDED THE SAME DAY"]

  - id: close-4
    at: 207.0
    hold: 5.0
    lines: ["LOGS 122-129 ARE NOT AVAILABLE IN THE PUBLIC RECORD"]

  # The channel closer, same shape as record 02's. Centre, not lower left:
  # there is no plate under it and nothing to sit beside.
  - id: close-5
    at: 212.0
    hold: 8.0
    size: 34
    pos: centre
    alpha: 235
    lines:
      - "FILE CLASS NINE"
      - "FC9-003 // CARBON BALANCE"
      - ""
      - "Work of fiction. No such station is on record."
