    # 5.4 runs entirely under silence, and a shot under silence has to be a
    # video clip: there is no voice and no text holding the picture up. A local
    # push there is exactly the frozen frame the Motion Policy exists to
    # prevent. The fallback should have been checked against the clock before
    # it was written down.
    #
    # What was done instead costs nothing. Luminance sampled every quarter
    # second showed take 1 flat for a full four seconds and blowing out only in
    # the fifth: 35.1 -> 37.7 over four seconds, which is dust crossing the
    # beam, then 53.7 and 69.1. So take 1 is reinstated and the shot is cut to
    # 4 s, which `assemble_scene.py` takes from the head of the clip. The
    # second goes to 5.1, a static card plate whose card finishes typing at
    # 11.0 s and which holds 13 s without changing anything. Scene 5 stays 32 s,
    # the record stays 220 s, and 5.4 is still a model clip under silence.
    #
    # The first rejection was correct for a five second cut and wrong for a
    # four second one. Worth measuring where a fault starts before paying for
    # another roll of a clip that has no seed.
    negative_extra: >
      brightening, light growing, glow expanding, lamp flaring, beam widening,
      exposure change, fade in, fade up
