    # Take 1 bloomed: by the end the lamp had flooded the whole corridor, which
    # reads as somebody turning it up, and nobody on this station touches
    # anything. `brightening` is in the shared negative prompt and did not hold
    # it — the shot asks for a lamp beam, and a lamp beam implies a lamp that
