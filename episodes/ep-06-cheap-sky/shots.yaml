    approved_seed: 11    # selected 2026-09-25
    motion_tier: model
    timeline_seconds: 10
    model: workhorse
    generate_seconds: 10
    motion: fine particulate drifting across the haze on a steady current
    motion_tail: motion_tail_air
    video_prompt: >
      Fine dark particulate drifts slowly and steadily across the frame from
      right to left on a steady current, and the haze behind it moves with
