# Record No. 6 — "THE CHEAP SKY"
#
# Derived from script.md. The script is the source of truth for the words;
# this file is the source of truth for what gets generated and what it costs.
#
# Prompt text here is already cleaned for the hygiene rules below. Camera
# moves for ffmpeg shots live in `local_motion`, never in the still's prompt:
# a still has no camera move, and "slow drift left" in an image prompt is a
# motion word the model reads as something drifting.

episode: ep-06-cheap-sky
runtime_seconds: 300
aspect: "16:9"

# The channel narrator, third person. Named once, here, and read by
# gen_narration.py, build_audio.py and build_captions.py alike.
voice: narrator

# Summed from the shots below, never from prose. Scene 6 absorbed the draft's
# 7.1 (the population line) on intake: the coda exemption covers cards and a
# held silent shot, not a spoken line.
scene_runtime: {1: 36, 2: 40, 3: 50, 4: 45, 5: 45, 6: 60, 7: 24}

# Scene 7: four shots over near-empty haze, two data cards and the channel
# closer, no voice. Declared, not waived.
coda: [7]

# --- Prompt hygiene ---------------------------------------------------------

hygiene:
  allow_grainy: []
  allow_hand: []
  forbid:
    # Rule 1 — nothing moves in a frame that will never be animated.
    #
    # Eleven shots here are built in ffmpeg from one approved still. In a
    # world made of haze the temptation is to let "a little haze drift" into
    # a plate; the draft did it five times ("only haze moves"). A frozen wisp
    # is a stalled player. The haze in every plate is one smooth gradient of
    # tone, which has nothing in it to freeze.
    #
    # The exception list is exactly the twenty-two model shots.
    - pattern: '\b(drift\w*|float\w*|motes?|suspended|vapou?r|mist|steam|smoke|sway\w*|swing\w*|turning|rotat\w*|blink\w*|flash\w*|puls\w*|flicker\w*|creep\w*|advancing|stream\w*|billow\w*|swirl\w*|sink\w*|fall\w*|rising|settl\w*|moving|moves|particulate|particles?|flecks?|specks?|wisps?|drizzle|drops?|rings?|ripples?|roll\w*|glid\w*|crossing|current)\b'
      except: ["1.1", "1.3", "1.4", "2.2", "2.3", "3.1", "3.2", "3.4", "3.5",
               "4.1", "4.2", "4.4", "4.5", "5.1", "5.3", "5.5", "6.1", "6.2",
               "6.4", "6.5", "7.1", "7.3"]
      why: >
        A shot built from a single still must contain nothing that the eye
        expects to see move. "Smooth", "unbroken" and "gradient" are the
        remedy and are deliberately not in this pattern.

    # Rule 2 — no surface a model can write on. 5.1 is the one piece of
    # hardware in the record, and a housing implies a plate, a label, a
    # display. Its prompt fills every face with worn material instead.
    - pattern: '\b(text|lettering|writing|written|label|labell?ed|plaque|placard|nameplate|legend|inscription|stencil\w*|serial|legible|numerals?|digits?|readout|display\w*|screen|monitor|gauge|dial|marking\w*)\b'
      except: []
      why: >
        Every character on this channel comes out of build_cards.py.

    # Rule 3 — nobody has walked here. The premise is that nothing on this
    # surface has legs, and every image model answers "Titan surface" with
    # the Huygens frame: rounded cobbles, and often the lander or its
    # parachute. A track, a print or a machine in the establishing shots is
    # the fiction contradicted. The surface is described positively as
    # "smooth and unbroken" instead, so none of these words is ever needed.
    - pattern: '\b(person|people''s|human|figure|hands?|fingers?|footprints?|boot ?prints?|tracks?|trail|tyre|tire|rover|lander|probe|parachute|vehicle|antenna|flag|trace)\b'
      except: []
      why: >
        "No people" ends every prompt and is not matched here.

    # Rule 4 — the animal appears where it is asked for and nowhere else.
    # Record 04: a frame showing part of an animal is an invitation to finish
    # it. The three shots that carry flyers name them as shapes or as one
    # flyer; every other prompt is kept free of the nouns.
    - pattern: '\b(animal|creature|bird|flyer|wings?|membrane|head|eyes?|tail|beak|feathers?|shapes?)\b'
      except: ["2.2", "4.4", "6.1"]
      why: >
        The only resolved appearance is 6.1. Everything else is haze, ground
        and two sets of distant unresolved shapes.

    # Rule 5 — one palette, one light. This record's declared deviation is
    # that the amber IS the scene light. What it forbids is a second source:
    # a sun disc, a lamp, a blue sky, a star. Titan's surface never shows
    # the sun as a disc and never shows a star.
    - pattern: '\b(blue|cyan|teal|green|white light|lamp|spotlight|sunbeam|sun disc|sunlit|lens flare|stars?|starlight|night|hard shadow)\b'
      except: []
      why: >
        A second light is a second location.

# --- Spines -----------------------------------------------------------------
# Material, light and palette only. One per camera distance, because a ground
# noun in the haze spine puts a horizon into every sky shot and a horizon in
# the macro spine puts a landscape into every top-down frame.

haze_spine: &haze_spine >
  Deep orange haze in every part of the picture, the light diffuse and
  arriving evenly from the whole sky at once, dim and flat, like a deep dusk
  with no source anywhere in it. Depth reads only as colour, the amber
  deepening with distance. The palette is amber, ochre, brown-grey and dull
  cream, and nothing else. No lettering. No people.

surface_spine: &surface_spine >
  Dark grey-brown organic sand and rounded pale ice cobbles, damp with liquid
  methane, under flat diffuse amber light that arrives evenly from the whole
  sky at once, so that nothing casts a shadow. Everything at any distance
  softens into orange haze. The palette is amber, ochre, brown-grey and dull
  cream, and nothing else. No lettering. No people.

# gen_stills.py reads `exterior_spine` as the default text spine. Every
# exterior here is the surface unless a shot names another key.
exterior_spine: *surface_spine

ground_macro_spine: &ground_macro_spine >
  Dark grey-brown organic sand with a fine even grain, uniformly dark and
  damp with liquid methane across the whole picture, and rounded opaque
  matte pebbles of dull cream like weathered river stones, every part of the picture at close to
  the same distance from the lens. Flat diffuse amber light with no shadow
  anywhere. The palette is amber, ochre, brown-grey and dull cream, and
  nothing else. No lettering. No people.

# 5.1 only: the one piece of hardware in the record, at a distance that
# happens once. Text-to-image against this, the way record 05's regolith
# macro was done. A housing implies a label and a display; this spine and the
# shot's prompt describe every face of it as worn material instead.
hardware_spine: &hardware_spine >
  Scuffed metal and pitted grey composite, every edge worn back to bare
  metal, fine dark organic dust packed into every seam and dulling every
  face, under flat diffuse amber light with no shadow. The palette is amber,
  ochre, brown-grey and dull cream, and nothing else. No lettering. No
  people.

# --- Video negative base ----------------------------------------------------
# Replaces gen_takes.py's channel default, which carries "water, wet floor,
# puddles, reflections on the floor" from the station interiors of records
# 01-05. Here the approved frames stand in methane pools and 3.4 is a pool
# with drizzle on it: the default would argue with the picture it animates.
# Everything else in the default is kept.
negative_base: >
  fast motion, camera shake, dolly, rapid push in, zoom, morphing geometry,
  changing architecture, brightening, blur, distortion, low quality, people,
  text, watermark

# --- Motion tails -----------------------------------------------------------

# Haze and particulate: every open-haze shot. The risk on a featureless
# gradient is that the model has nothing to hold and invents a camera move,
# or reads specks as dirt on the lens. Both are named.
motion_tail_air: &motion_tail_air >
  Only the haze and the fine particulate in it move, slowly and evenly, and
  they keep moving for the whole shot. The camera itself does not move at
  all: no dolly, no push in, no pull back, no pan, no tilt, no parallax. No
  ground and no horizon appear. No cuts, no speed changes, no zoom snaps.
  Nothing enters the frame.

# Dust, vapour, drizzle, settling: the ground shots. The shape of the ground
# stays fixed and only the fine material over it moves.
motion_tail_ground: &motion_tail_ground >
  The one movement named above happens steadily for the whole shot, at an
  unhurried speed. The sand, the cobbles and the horizon keep exactly their
  shape and position. The camera itself does not move at all: no dolly, no
  push in, no pull back, no pan, no tilt, no parallax. No cuts, no speed
  changes, no zoom snaps. Nothing enters the frame.

# The flyers. Pure translation, per record 04: the body moves, nothing about
# it changes.
motion_tail_crossing: &motion_tail_crossing >
  The movement named above is pure translation at a steady unhurried speed:
  the flyer or the shapes move across the frame and nothing about them
  changes. Wings stay exactly as they are, nothing flaps, folds, unfolds,
  grows, turns toward the camera or becomes anything else. The camera itself
  does not move at all: no pan, no tilt, no follow, no zoom. No cuts, no
  speed changes. Nothing else enters the frame.

# --- Anchors ----------------------------------------------------------------
# Three, one per camera distance that recurs. The draft's A4 (flyer at
# distance) and A5 (hardware close) each served one shot and were dropped on
# intake; see script.md, correction 9.

anchors:
  - id: A1-haze
    model: anchor
    approved_seed: 11         # approved 2026-09-25, pass 2
    approved_file: anchors/A1-haze.jpg
    covers: ["1.1", "3.1", "3.5", "4.1", "4.5", "5.3", "6.1", "6.2", "6.5",
             "7.1", "7.2", "7.3", "7.4"]
    spine: *haze_spine
    subject: >
      Camera: 35mm lens, level, pointed into open air with nothing in front
      of it. Subject: open amber haze with no ground, no horizon and no edge
      anywhere, one continuous graded depth, its tone almost the same across
      the whole picture from the top edge to the bottom edge, the lower left
      quarter only a slightly deeper amber than the rest and completely
      empty.
    note: >
      Pass 1 (seeds 11/22/33, all rejected): every seed grew a dark band along
      the bottom of the frame, near-black with a hard horizontal edge in s11
      and s33 — ground and a horizon, in the one anchor that has neither. The
      cause was this subject's own clause, "deepening toward the bottom ...
      the lower left quarter is the darkest": the model read dark-at-the-bottom
      as land. s22 also carried a bright hotspot top right that reads as the
      sun behind the haze. Pass 2 changes one property, the vertical tone
      gradient. If the hotspot persists, it is pass 3's change.

      Pass 2: s11 approved. No band, no horizon, the lower left a deep rust
      under where the cards go. The bright area top centre-right is a broad
      diffuse glow, not a disc, and the cream patch at right sits inside the
      palette. s22 kept a thin dark horizon line and a sun-like hotspot; s33
      still grew ground.

  - id: A2-plain
    model: anchor
    approved_seed: 33         # approved 2026-09-25
    approved_file: anchors/A2-plain.jpg
    covers: ["1.2", "1.3", "2.1", "2.2", "2.3", "3.3", "4.3", "4.4", "5.2",
             "5.5", "6.3", "6.4", "6.6"]
    spine: *surface_spine
    subject: >
      Camera: 24mm lens at ground level, level, the horizon across the upper
      third of the frame. Wide shot. Subject: a flat plain of dark organic
      sand scattered with rounded pale ice cobbles running out to a horizon
      that dissolves into orange haze about a kilometre away, the sand smooth
      and unbroken between the cobbles. The lower left quarter of the frame is
      empty smooth damp sand, because that is where every data card in this
      record is drawn.
    note: >
      Pass 1: s33 approved. Horizon in the upper third, lower left empty wet
      dark sand, cobbles matte and cream — the nearest of the three to the
      palette. Known faults, accepted: too many cobbles, some dark clods of
      earth, and it reads close to Iceland's ice beach. s11 was rejected for a
      shadow wedge on the sand and marks like footprints bottom right; s22
      for glassy blue-white glacier ice.

  - id: A3-ground-macro
    model: anchor
    approved_seed: 22         # approved 2026-09-25, pass 3
    approved_file: anchors/A3-ground-macro.jpg
    covers: ["1.4", "2.4", "3.2", "3.4", "4.2", "5.4"]
    spine: *ground_macro_spine
    subject: >
      Camera: 100mm macro lens directly above the ground, pointing straight
      down. Subject: damp dark grey-brown sand, uniformly dark and damp across
      the whole picture, with two rounded opaque matte pebbles of dull cream,
      like weathered river stones, in the right half of the frame. Every part of the picture is that ground, at
      the same distance from the lens as every other part, because the
      camera is directly above it and pointing down, so the whole picture is
      equally sharp. The ground continues in every direction past the edges
      of the picture, so the picture is a piece of it and not a view across
      it. There is no sky and no distance anywhere in it. The lower left
      quarter is empty smooth sand.
    note: >
      Pass 1 (seeds 11/22/33, all rejected): none was top-down. All three
      were low oblique views with the ground receding into a bright band at
      the top, which an anchor would then hand to every one of six macro
      shots. The cobbles also came back as clear glassy ice balls. Pass 2
      changes the geometry only, with the wording that fixed record 05's
      regolith macro — "shallow depth of field" came out with it, because a
      focus falloff across the frame is itself a depth cue. The glass is pass
      3's change if it survives: replace "ice cobbles" with opaque matte
      pebbles of dull cream.

      Pass 2: geometry fixed in s11 and s22 — near top-down, sharp across the
      frame; s33 stayed oblique. Two faults survived in all three and were
      present in pass 1 as well: the cobbles are clear glassy balls, and the
      sand splits into bright dry gold on one side and dark wet on the other,
      a sunny beach. Pass 3 changes both, in the spine and here, because they
      sit in different nouns and each is visible on its own in the result:
      "pale ice cobbles" becomes opaque matte pebbles of dull cream, and the
      sand is uniformly dark and damp. The word "ice" is what returns
      glacier ice; the cobbles on Titan are water ice, but they look like
      stones, and the picture has to show what they look like.

      Pass 3: s22 approved. The glass is gone in all three seeds — opaque
      matte cream pebbles. s22 is the only true top-down frame, sharp across,
      with the lower left empty smooth sand. Known faults, accepted: the sand
      still splits into ochre on the left and dark wet on the right, and the
      light is directional enough to leave short shadows under the pebbles.
      Both are left to the shot prompts, which say "flat shadowless light".
      s33 had the uniform dark sand and went oblique again; a fourth pass was
      likely to trade one fault for the other.

# --- Shots ------------------------------------------------------------------
#
# `approved_seed` is filled at stage 5. Eleven shots are ffmpeg: nine carry a
# card and two are texture under narration. No two of them are adjacent
# anywhere in the record — every ffmpeg shot has a model shot on both sides.

