# The thirty-second teaser — record 06. Posted before the record exists, the
# only piece on this channel allowed a cue under it, closing on SOON.
#
# Five lines that escalate on their own: a human flies at jogging speed,
# nothing has legs, heat is not free, nothing here can be warm, and no animal
# has left the ground. None explains another. 6.1 — the only resolved view of
# the animal — is kept out: that belongs to the record.
#
# Timing from audio/alignment/ (2026-09-27). Two lines are trimmed to their
# first sentences, each at a point inside a real silence in the take:
#   s3p1  "not." ends 2.043, next word 2.287 — 0.24 s of silence; cut at 2.20
#   s3p4  "be."  ends 2.717, next word 3.320 — 0.60 s of silence; cut at 2.90

runtime_seconds: 30.0
aspect: "9:16"
slug: "FC9-006 // THE CHEAP SKY"

end_card:
  at: 26.0
  seconds: 4.0
  lines: ["SOON", "ON THE CHANNEL"]

shots:
  - {id: "1.3", at:  0.0, from: 1.0, seconds: 5.0, crop_x: 0.55}
  - {id: "2.2", at:  5.0, from: 2.0, seconds: 4.5, crop_x: 0.50}
  - {id: "3.1", at:  9.5, from: 1.0, seconds: 3.5, crop_x: 0.50}
  - {id: "3.2", at: 13.0, from: 2.0, seconds: 3.5, crop_x: 0.68}
  - {id: "3.4", at: 16.5, from: 1.0, seconds: 4.0, crop_x: 0.45}
  - {id: "4.4", at: 20.5, from: 2.0, seconds: 3.0, crop_x: 0.50}
  - {id: "5.3", at: 23.5, from: 2.0, seconds: 2.5, crop_x: 0.50}

lines:
  - {pid: s1p2, at:  0.20}   # "...would fly at four point two metres per second."
  - {pid: s2p3, at:  9.20}   # "Legs are a solution to a problem that does not exist here."
  - {pid: s3p1, at: 14.00, trim: 2.20}   # "Lift is free. Heat is not."
  - {pid: s3p4, at: 17.10, trim: 2.90}   # "Nothing here is warm. Nothing here can be."
  - {pid: s5p5, at: 21.00}   # "No animal has been recorded leaving the ground after that."

# Levels are trims on measured files, not copied from record 05. The tone is
# the record's own trim (audio.yaml), through the same 250 Hz high-pass, so the
# teaser sounds like the record. Music measured 2026-09-27: -21.3 dBFS mean,
# -29.7 above 300 Hz, against a voice at about -19 in that band. Trim -6 puts
# the cue ~16 dB under the voice where a phone plays it. Record 05's -13 was
# set on the full-band mean and would have lost it on a small speaker.
levels:
  music: -6
  tone: 14
  voice: 0

music: sfx/teaser-music.mp3
