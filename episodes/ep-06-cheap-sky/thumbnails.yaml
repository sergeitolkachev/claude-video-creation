# Thumbnail variants for A/B — record 06. Three plates, three different
# promises: the animal, the human, and the ceiling.
#
# Plates are approved stills, frames the viewer actually meets: 6.1 at 3:36
# (the only resolved view of the flyer), 1.3 at 0:20, 2.2 at 0:46. Nothing is
# generated for a thumbnail.
#
# Judge at 210 px, which is what YouTube renders in a grid. The slug is
# constant across all three and is never part of what a test varies. Variant
# ids do not get renamed: a conversion figure gets attached to them later.

episode: ep-06-cheap-sky
slug: "FC9-006 // The Cheap Sky"
export: {width: 1280, height: 720}

variants:
  # A — the animal. The one frame in the record where it resolves, and the
  # figure that explains why it can exist at all. The flyer holds the right
  # third at mid-height; the type takes the empty haze top-left and stops
  # before the membrane starts.
  - id: a-the-flyer
    plate: "6.1"
    crop: {zoom: 0.92, bias_y: 0.50}
    blocks:
      - lines: ["0.65 WATTS"]
        size: 104
        tracking: 4
        x: 0.05
        y: 0.08
        anchor: left
        scrim: true
      - lines: ["TO STAY IN THE AIR"]
        size: 36
        tracking: 8
        x: 0.05
        y: 0.30
        anchor: left
        scrim: true

  # B — the human. The figure a viewer can check against their own body:
  # jogging speed. The plate is the low view of the plain, with the flat haze
  # of the upper third to carry the type and the cobbles lower right.
  - id: b-the-human
    plate: "1.3"
    crop: {zoom: 0.92, bias_y: 0.50}
    blocks:
      - lines: ["4.2 m/s"]
        size: 118
        tracking: 4
        x: 0.05
        y: 0.07
        anchor: left
        scrim: true
      - lines: ["A HUMAN COULD FLY HERE"]
        size: 36
        tracking: 8
        x: 0.05
        y: 0.31
        anchor: left
        scrim: true

  # C — the ceiling. The whole biosphere in one figure, over the distant
  # population it has to feed. The domes sit high in the haze, so the type
  # goes low, onto the dark dune, and stops above the slug's band.
  # First build at zoom 0.92: at 210 px the domes all but vanished and the
  # plate read as empty haze with a number on it. Cropped in on the domes'
  # half of the frame so they survive the grid.
  - id: c-the-budget
    plate: "2.2"
    crop: {zoom: 0.65, bias_x: 0.50, bias_y: 0.02}
    blocks:
      - lines: ["1.8 GW"]
        size: 110
        tracking: 4
        x: 0.05
        y: 0.46
        anchor: left
        scrim: true
      - lines: ["FOR EVERYTHING ALIVE"]
        size: 36
        tracking: 8
        x: 0.05
        y: 0.70
        anchor: left
        scrim: true
