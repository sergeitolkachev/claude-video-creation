    # into its hinge and the blue light on the frames drops. The first 5 s are
    # slowed 2x by motion interpolation to fill the 10 s shot, the repair that
    # shipped on record 07's 1.2 and 2.3.
    retime: 2.0
    retime_mode: interpolate
    retime_exception: >
      Record 11, 2026-11-10: the only clean part of the take is its first
      5 s. Verticals cut from takes/ at real speed, so any vertical using 5.1
      (.b does) must stay inside its first 4.5 s.
    motion: the locker door swinging open on its hinge
    motion_tail: motion_tail_steady
    video_prompt: >
      The small square locker door swings slowly open on its hinge as one
      rigid piece, steadily for the whole shot.
    negative_extra: >
      the door bending, a second door opening, objects coming out of the
      locker, a hand, the hinge moving to the other side
    anchors: [A3-headon]
    note: Kling stops a door that meets its frame; this one opens, so it is written to run the whole clip
    prompt: >
