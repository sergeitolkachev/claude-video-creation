    note: not generated — 8 s of takes/2.3.mp4 from 0.0 s. Fallback if 2.3 fails twice — a local push on approved/2.4.jpg
    prompt: >
      The same pressure gauge and needle, flat cool light, no people

  - id: "3.2"
    scene: 3
    motion_tier: static
    timeline_seconds: 10
    source: ffmpeg_still
    motion: static
    card: difference
    ref_shot: "1.3"
    prompt: >
      The same work surface as the reference, two sheets of plain ruled paper
      overlapping under the steel clip bar, the pencil seated in its clip,
      flat even cool light, the air above completely clear, the lower left
      of the frame bare painted aluminum, no people

  - id: "3.3"
    scene: 3
    motion_tier: local
    timeline_seconds: 12
    source: ffmpeg_still
    motion: static
    local_motion: push
    anchors: [A3-headon]
    prompt: >
