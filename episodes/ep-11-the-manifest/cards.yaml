  # --- Coda ----------------------------------------------------------------
  - id: no-entries
    shot: "8.1"
    pos: lower-left
    build: line
    at: 0.5
    lines:
      - "SEVER-5"
      - "NO LOG ENTRIES AFTER DAY 23"

  - id: return-burn
    shot: "8.3"
    pos: lower-left
    build: line
    at: 0.5
    lines:
      - "RETURN BURN, DAY 61"
      - "MASS         +1,936 KG"
      - "DELTA-V  1,588 OF 1,644"
