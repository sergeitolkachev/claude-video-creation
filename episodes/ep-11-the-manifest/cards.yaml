    pos: lower-left
    build: line
    at: 0.5
    lines:
      - "TCM-2 / GIMBAL TRIM"
      - "OFF PREDICTION   0.55°"
      - "ARM                9 M"
      - "CG SHIFT    8.6 CM FWD"

  # --- Scene 5 -------------------------------------------------------------
