    at: 0.5
    lines:
      - "TCM-3 / DAY 23"
      - "OFFSET        +671 KG"
      - "GIMBAL TRIM     0.76°"
      - "POSITION    4.5 M FWD"

  # --- Scene 7 -------------------------------------------------------------
