# Record No. 5 — "THE OPERATOR WENT INTO GALLERY THREE ALONE"
#
# Derived from script.md. The script is the source of truth for the words;
# this file is the source of truth for what gets generated and what it costs.
#
# Prompt text here is already cleaned for the hygiene rules below. Do not copy
# prompt prose out of script.md into a generation call by hand — that text is
# laid out for a human reader, and on this record it was laid out by an agent
# that put the camera move in the same sentence as the subject. The split is
# the whole reason this file exists.

episode: ep-05-gallery-three
runtime_seconds: 225
aspect: "16:9"

# The operator, first person. Record 03 was the first told in this voice and
# it broke three scripts in turn, each of which had read config/voice.yaml on
# its own and found `narrator` written into it. An episode names its voice
# once, here, and gen_narration.py, build_audio.py and build_captions.py all
# read this key. The dangerous one is the third: captions timed against a
# voice that is not in the record place every word where it is not spoken.
voice: character

# Per-scene runtime, read by scripts/validate.py. Every figure is summed from
# the shots below, never from the prose. The submitted script arrived with the
# arithmetic already correct — 26 shots summing to 225 s exactly, per scene
# and overall — which is the first time that has happened on this channel.
scene_runtime: {1: 30, 2: 35, 3: 40, 4: 40, 5: 40, 6: 25, 7: 15}

# Scene 7 is the coda: two card plates with no voice at all. The recording has
# ended and the recovery frame is delivered as text, which is where the payoff
# of the record lives — the battery hour and the suit count are deliberately
# withheld from the operator, who never learns either. 100% silent by
# construction, so it is declared rather than dragging the body average down.
# Declared, not waived: validate.py measures the body without it and prints it
# separately.
coda: [7]

# --- Prompt hygiene ---------------------------------------------------------
# Everything here was decided in the script or on intake, and is repeated as a
# pattern so a later edit to a prompt cannot quietly break it. Each rule is a
# failure someone has already paid for, on this record or an earlier one.

hygiene:
  allow_grainy: []
  allow_hand: []
  forbid:
    # Rule 1 — nothing moves in a frame that will never be animated.
    #
    # Thirteen of the twenty-six shots here are built in ffmpeg from one
    # approved still. A still that contains dust in the air, a hanging strap,
    # condensation or a lit indicator is a frozen photograph of something that
    # ought to be moving, and on a screen that does not read as a locked-off
    # camera — it reads as a stalled player, which is the tape-dropout failure
    # in another form. Record 04 paid $1.75 re-rolling three coda plates
    # through Kling for exactly this, having exempted them from the rule by
    # assertion.
    #
    # The exception list is not a list of tolerated faults. It is, precisely,
    # the thirteen shots that go to a video model, where every one of these
    # words is the subject. Moving a shot off the model tier means taking its
    # id out of here, and the rule then tells you what has to come out of the
    # prompt with it.
    - pattern: '\b(drift\w*|float\w*|motes?|suspended|vapou?r|mist|steam|smoke|condensation|sway\w*|swing\w*|turning|rotat\w*|blink\w*|flash\w*|puls\w*|flicker\w*|creep\w*|advancing|stream\w*|billow\w*|swirl\w*|sink\w*|falling|rising|spark\w*|moving)\b'
      except: ["1.1", "1.3", "2.3", "2.4", "3.1", "3.3", "3.4",
               "4.4", "4.5", "5.4", "5.5", "6.2", "6.3"]
      why: >
        A shot built from a single still must contain nothing that the eye
        expects to see move. The words "loose", "hanging" and "clear" are
        deliberately not in this pattern: they are the remedy, and a rule that
        fires on its own remedy is a rule nobody can read past.

    # Rule 2 — no surface that a model can write on.
    #
    # The submitted draft asked for "one flat screen ... with nothing
    # displayed on it" on 4.1 and 6.1. Every noun in that clause is one record
    # 04 forbids outright: Seedream and nano-banana invent garbage glyphs out
    # of anything that resembles a panel with information on it, and this
    # channel's entire claim to having been issued rather than assembled is
    # that every character on screen comes out of one Pillow renderer. The
    # console is a flat glass panel lit evenly from behind now, with nothing
    # behind it.
    # "plaque", "placard", "nameplate" and "legend" joined this list after
    # scene 4's batch. They were never in a prompt and are not what went
    # wrong: 4.1 came back with a small white label plate above and below
    # every one of forty toggle switches, each carrying invented lettering,
    # because a console with rows of switches IMPLIES labels and record 03's
    # rule is that a negation only works when the subject does not. The real
    # fix is in 4.1's prompt, which now describes bare switches set into
    # unbroken metal. This pattern is here so that a later editor cannot
    # reintroduce the noun by hand.
    - pattern: '\b(text|lettering|writing|written|label|labell?ed|plaque|placard|nameplate|legend|inscription|stencil\w*|serial|legible|numerals?|digits?|readout|display\w*|screen|monitor|gauge|dial)\b'
      except: []
      why: >
        Every character on this channel comes out of build_cards.py. The six
        data cards in this record are drawn in Menlo at 40 px in phosphor
        green, and nothing in the picture underneath them is allowed to be
        writing.

    # Rule 3 — no people, and no suit that could become one.
    #
    # The ordinary version of this rule holds: "no people" ends every prompt
    # and has never failed across records 01 to 04. What is new here is the
    # empty suit. Record 04 learned that a frame showing part of an animal is
    # an invitation to finish it — Kling grew a head with an eye onto a tail
    # in two shots out of two. A pressure suit hanging on a hook is the same
    # invitation in a different shape: it is a person-shaped hole, and 1.3 and
    # 4.4 hold it in frame for ten seconds each. The still stage cannot catch
    # this, because the still is right and the clip invents what the still
    # withholds. It is named in negative_extra on both shots and the motion is
    # written as pure translation of one strap.
    #
    # "eye" and "face" are NOT in this pattern on purpose: five prompts open
    # "eye-height view down a corridor" and one is a macro of the face of a
    # hatch, and a hyphen is a word boundary. A rule that fires on the right
    # word in the wrong sense gets switched off.
    - pattern: '\b(man|woman|person|crew|operator|astronaut|figure|hands?|arms?|fingers?|shoulder|wearing|inhabited)\b'
      except: []
      why: >
        The word "people" is deliberately absent: every prompt ends with the
        clause "no people". What this catches is the noun that arrives by
        accident, like "operator's console".

    # Rule 4 — the far side has no air and no weather.
    #
    # Outside, there is no haze, no glow on the horizon, no cloud and no
    # atmosphere of any kind: shadows have a razor edge with no fill in them
    # and the sky is black at every angle including next to the sun. Every
    # image model answers "lunar surface" with a hazy terminator glow, because
    # that is what the illustration training data is full of.
    - pattern: '\b(haze|hazy|mist over|atmospher\w*|cloud\w*|fog|glow on the horizon|airglow|aurora|blue sky|sunset colou?rs?|golden)\b'
      except: []
      why: >
        Interiors have air and one of them has mist in a depressurising
        airlock, which is real and is why "mist" alone is in rule 1 and not
        here. What this catches is an atmosphere outside.

    # Rule 5 — nobody has been outside.
    #
    # Found on scene 1's first batch. Shot 1.1 came back in one seed out of
    # two with an evenly spaced line of boot prints crossing the regolith,
    # bright rim and dark cavity, unmistakable: Seedream answers "lunar
    # surface" with Apollo photography, because that is what lunar surface
    # photography IS in the training data. In a record whose premise is one
    # man who has not left the station, a human track outside is not a blemish
    # — it is the fiction contradicted in the establishing shot.
    #
    # The remedy is written positively — "the surface unbroken and continuous
    # with nothing crossing it" — so that none of these words has to appear in
    # a prompt to keep one out of the picture.
    # "module", "equipment" and "base" were in this pattern for about a minute
    # and came straight back out: two prompts describe the side of a battery
    # module, which is a station part and not a piece of Apollo hardware
    # parked on the regolith. The pattern names the specific nouns, not the
    # general ones.
    - pattern: '\b(footprints?|boot ?prints?|tracks?|tread|trail|tyre|tire|rover|lander|flag|antenna|outpost)\b'
      except: []
      why: >
        Every exterior in this record is ground nobody has walked on. The
        interiors are unaffected: none of these nouns belongs in one either.

    # Rule 6 — no saturated colour, and no painted markings to carry it.
    #
    # Also from scene 1's first batch. Both candidates for 1.3 put a saturated
    # yellow hazard stripe along the floor, one of them in the lower left
    # where the slug sits for the record's first five seconds. The spine says
    # "desaturated blue-grey, graphite and dull silver, and nothing else", and
    # the model volunteered the colour anyway, because an industrial interior
    # in the training data has a painted floor in it. A spine states the
    # palette; it does not defend it.
    - pattern: '\b(yellow|orange|amber|red|hazard|warning strip\w*|painted line|colou?rful|high-vis\w*)\b'
      except: []
      why: >
        The palette is desaturated blue-grey, graphite and dull silver
        outside and in. "Blue" is deliberately absent from this pattern:
        every interior prompt in the record says "cold white-blue light".

# --- Spines -----------------------------------------------------------------
# Material, light and palette only. No camera, no distance, no lens, no
# framing words, and no object named — not even to forbid it. Record 03's
# spine said its work lamp "appears only in the shots that name it" and the
# lamp then stood in eight of fifteen anchor candidates: the model reads the
# noun and discards the clause governing it.
#
# One spine per camera distance, which is record 03's other lesson and record
# 04's proof. "A station corridor" is a framing instruction wearing a
# material's clothes, so the two macro distances get spines with no room and
# no landscape in them at all.

anchor_spine: &spine >
  Scuffed brushed aluminium and off-grey composite panelling, every edge worn
  down to bare metal, fine grey dust packed into every seam and rivet line.
  Cold white-blue light from overhead, low and even, falling off into
  near-black within a few metres. The palette is desaturated blue-grey,
  graphite and dull silver, and nothing else. No saturated colour. No people.

# The interior macro distance. No room noun anywhere in it: no corridor, no
# station, no wall, no ceiling. Record 03 lost three passes of macro anchors
# to a spine that opened "interior of an orbital relay station", and record 04
# landed the same distance on the third pass only after the room words came
# out.
macro_spine: &macro_spine >
  Worn brushed aluminium and grey woven fabric with abrasion and pilling in
  it, fine grey dust caught in the knurling and worked into the stitching,
  every surface in the picture at close to the same distance from the lens.
  One cold white-blue source from one side. The palette is desaturated
  blue-grey, graphite and dull silver, and nothing else. No saturated colour.
  No people.

# Outside. Two anchors share it, because the material is the same and the
# light is not: A1 is rim-lit and A1n is starlight, and the difference is
# written into each anchor's own subject rather than into the spine.
exterior_spine: &exterior_spine >
  Fine powdery pale-grey regolith, undisturbed. Hard black shadow with a razor
  edge to it and no fill light inside it at all. Nothing softens anything and
  there is no haze at any distance. A black sky filled edge to edge with
  small, sharp, unmoving stars. The only light is hard white light or
  starlight. The palette is monochrome, grey through black, and nothing else.
  No people.

# The same ground with no sun on it, and its own spine because the exterior
# spine above cannot be reused for it. Pass 1 handed A1n the exterior spine
# and got three brightly sunlit craters back, one of them with a grey glow
# along the horizon: the spine offers "hard white light or starlight", and a
# model reading that sentence takes the hard white light every time, exactly
# the way record 03's spine named a work lamp and then put it in eight frames
# out of fifteen. There is no shadow noun in here either — at night nothing
# casts a shadow, everything unlit is simply black — and the picture is told
# outright that most of it is black, because an image that is mostly black is
# statistically rare and a model will light it if it is not stopped.
#
# One change from pass 1, not two. The geometry sentence in A1n's subject is
# left word for word as it was, because the identical sentence in A1 returned
# a ground-level view in all three seeds. If pass 2 lands the light and the
# camera is still up on the rim, the geometry is pass 3's change and not this
# one's — which is the discipline record 04's A3 needed three passes to learn.
night_exterior_spine: &night_exterior_spine >
  Fine powdery pale-grey regolith, undisturbed, seen by starlight and by
  nothing else. There is no sun anywhere and no sunlight on anything. Most of
  the picture is black, and the ground is barely readable, dark grey on black,
  with no bright surface anywhere in it. A black sky filled edge to edge with
  small, sharp, unmoving stars, with no glow of any kind along the horizon and
  no light in the sky but the stars themselves. The palette is black, with
  only the faintest dark grey in it, and nothing else. No people.

# One shot: 7.2, a macro of the ground outside. It is neither the exterior
# wide nor the interior hardware macro, and handing it either anchor returns
# that anchor's distance — the failure record 01 paid a whole pass for. There
# is no anchor at this distance because it happens once, so it goes
# text-to-image against its own spine, the way record 04's one tissue shot
# did. Written the way record 04's macro_spine finally worked: the material
# described by what it is smooth of, and the geometry stated positively.
regolith_macro_spine: &regolith_macro_spine >
  A surface of fine pale grey dust, so fine that it has no visible grains,
  marked only by the faint pitting where single particles have settled on it.
  Every part of the picture is that surface, at the same distance from the
  lens as every other part, because the camera is directly above it and
  pointing down. The surface continues in every direction past the picture, so
  the picture is a piece of it and not a view of it. One hard white source
  comes in low from one side and every pit casts its own small hard black
  shadow. There is no sky and no distance anywhere in it. The palette is pale
  grey through black, and nothing else. No people.

# --- Motion tails -----------------------------------------------------------
# Appended to every video prompt by gen_takes.py. They are what stops Kling
# inventing a camera move, and they are the reason the static tier is built in
# ffmpeg instead of asked for politely.

motion_tail_drift: &motion_tail_drift >
  Only the suspended dust moves, slowly and evenly, and it keeps moving for
  the whole shot. The camera itself does not move at all: no dolly, no push
  in, no pull back, no pan, no tilt, no parallax. The light source does not
  move and the beam does not sweep. No cuts, no speed changes, no zoom snaps.
  Nothing enters the frame and nothing new appears in it.

motion_tail_event: &motion_tail_event >
  The one movement named above happens and completes within the shot, at a
  steady unhurried speed. Everything else in the frame is still. The camera
  itself does not move at all: no dolly, no push in, no pull back, no pan, no
  tilt, no parallax. Nothing in the frame changes shape, grows, unfolds or
  becomes anything else. No cuts, no speed changes, no zoom snaps. Nothing
  else enters the frame.

# For the two shots where the camera genuinely travels down the corridor.
# Kling holds a frame and it holds a single continuous move; what it will not
# do is hold a frame while being told to, which is why the static tier is
# built in ffmpeg and this tail exists for exactly two shots.
motion_tail_travel: &motion_tail_travel >
  The camera moves continuously and slowly in that one direction for the whole
  shot and in no other: no pan, no tilt, no rotation, no reversal, no pause,
  no zoom. The corridor keeps its shape exactly and no part of it changes as
  the camera passes. The suspended dust streams past at a steady rate. No
  cuts, no speed changes. Nothing enters the frame.

# --- Anchors ----------------------------------------------------------------
# Five, one per camera distance and light condition that recurs. An anchor
# locks composition as hard as it locks palette, so handing A2 to a macro shot
# returns a corridor — that is the failure that cost record 01 a whole pass.
#
# A1 and A1n are the same ground in two lights. The exterior appears three
# times in this record and in three states — low sun on the rim (1.1), full
# night under starlight (2.1), first light on the peaks (7.1) — and an anchor
# holds light as hard as it holds framing. A1 carries the two rim-lit shots;
# the night is its own anchor because a sun in the reference puts a sun in the
# frame.
#
# approved_seed plus the prompt here reproduces the approved image exactly. Do
# not regenerate an approved anchor: every still in the record is built
# against these frames. All candidates from all passes stay under
# anchors/pass-N/.
anchors:
  - id: A1-crater-lowsun
    model: anchor
    approved_seed: 11         # approved 2026-09-21
    approved_file: anchors/A1-crater-lowsun.jpg
    covers: ["1.1"]
    spine: *exterior_spine
    subject: >
      Camera: 24mm lens at ground level, level, the rim across the upper third
      of the frame. Wide shot. Subject: a flat crater floor of pale grey
      regolith running out to a distant mountainous rim, one low hard white
      source grazing it from the right so that every ridge throws a long hard
      black shadow with nothing inside it. The lower left quarter of the frame
      is unlit ground going to black.

  - id: A1n-crater-night
    model: anchor
    approved_seed: 11         # approved 2026-09-21
    approved_file: anchors/A1n-crater-night.jpg
    covers: ["2.1", "7.1"]   # 7.1 moved here from A1 after batch 1
    spine: *night_exterior_spine
    subject: >
      Camera: 24mm lens at ground level, level, the rim across the upper third
      of the frame. Wide shot. Subject: a flat floor of pale grey regolith
      running out to a distant mountainous rim, with no sun on any part of it,
      the ground reading as the faintest dark grey against a black sky and the
      rim as a flat black edge with no detail in it at all. The ground takes
      up the lower half of the picture and is almost entirely black. The lower
      left quarter of the frame is black and empty.
    note: >
      Pass 1 came back as three brightly sunlit craters seen from up on the
      rim, one of them with a grey gradient glow along the horizon — an
      atmosphere, in a record whose fourth hygiene rule forbids one. The fault
      was in the spine, not in the subject: the exterior spine offers "hard
      white light or starlight" and a hard black shadow with a razor edge, and
      both clauses are instructions to light the scene. Pass 2 gives the night
      its own spine and changes nothing else.

      Pass 2 landed the two things this anchor exists to hold: no sun anywhere
      in any of the three seeds, and a ground-level camera on a flat floor
      with the rim in the upper third — the elevated bowl view went away on
      its own when the light wording changed, which is the case for changing
      one property at a time rather than the case against it.

      One fault remains, and it is a selection decision rather than a rework:
      the plain is still brighter than starlight would leave it, brightest in
      s22 and s33 and darkest in s11. An image that is mostly black is rare in
      the training data and the model lifts it. It is not fixed by
      regenerating an approved frame; if it has to go, it is pass 3 changing
      that one property.

  - id: A2-corridor
    model: anchor
    approved_seed: 11         # approved 2026-09-21
    approved_file: anchors/A2-corridor.jpg
    covers: ["2.4", "3.1", "5.3", "5.5", "6.2"]
    spine: *spine
    subject: >
      Camera: 28mm lens at eye height on the axis of the corridor, level, the
      vanishing point in the centre of the frame. Subject: a narrow corridor
      of worn aluminium panelling running away from the lens into darkness,
      lit in separate pools by cold overhead sources with unlit stretches
      between them, the far end lost in black. The lower left of the frame is
      unlit panelling.

  - id: A3-macro-hardware
    model: anchor
    approved_seed: 11         # approved 2026-09-21
    approved_file: anchors/A3-macro-hardware.jpg
    covers: ["1.2", "2.2", "2.3", "3.2", "3.3", "4.2", "4.5", "5.1", "5.2",
             "5.4"]   # 4.2 moved here from ref_shot 1.2 after batch 1
    spine: *macro_spine
    subject: >
      Camera: 100mm macro lens twenty-five centimetres from the subject,
      square on to it, shallow depth of field. Subject: a worn aluminium
      fitting seen close enough that the machining marks and the dust in them
      are the whole of the picture, one cold source raking it from the left
      and the right side of the frame falling into deep shadow. There is no
      room behind it: the picture is filled by the fitting and by what it is
      set into.

  - id: A4-object-mid
    model: anchor
    approved_seed: 11         # approved 2026-09-21
    approved_file: anchors/A4-object-mid.jpg
    covers: ["1.3", "3.4", "4.1", "4.3", "4.4", "6.1", "6.3"]
    spine: *spine
    subject: >
      Camera: 50mm lens two and a half metres from the subject, square on to
      it, the subject centred. Mid shot. Subject: a single piece of station
      fitting mounted on a worn aluminium wall, lit from above by one cold
      even source, the wall falling away into near-black to either side of it.
      The lower left quarter of the frame is in shadow and completely empty,
      because that is where every data card in this record is drawn.

# --- Shots ------------------------------------------------------------------
#
# `approved_seed` is the candidate a human picked out of stills/, written down
# for the same reason an anchor's is: stills/ and approved/ are media and are
# not versioned, so without the seed an approved frame is only reproducible by
# eye. Prompt plus seed brings it back exactly. It is filled in at stage 5 and
# is empty until then.
#
# Thirteen shots here have `source: ffmpeg_still` and cost nothing. That is
# not a saving taken out of the record: eight of them carry a data card, where
# the Motion Policy wants the frame still because the eye is on the text, and
# five are texture under narration. Every shot that runs under silence, and
# every shot whose content should physically move, is on the model tier.

shots:

  # SCENE 1 — NIGHT HOUR ZERO (30 s)
  #
  # Image first, no card, no logo. The record opens on the last ten seconds of
  # daylight this station will see for two weeks, and the only thing that
  # happens in them is the shadow arriving.

  - id: "1.1"
    scene: 1
    approved_seed: 11    # selected 2026-09-21
    motion_tier: model
    timeline_seconds: 10
    model: workhorse
    generate_seconds: 10
    motion: the shadow edge creeping toward the camera
    motion_tail: motion_tail_event
    # The submitted draft asked for "camera locked, very slow push forward" in
    # one sentence. That is two instructions, and record 01 established what
    # this model does with a contradiction. The camera is locked and the
    # movement is the terminator, which is the one thing in this frame that is
    # actually moving in the fiction. It is also slow: if the take comes back
    # with nothing visibly happening in ten seconds, the fix is a faster edge
    # in the prompt, not a camera move.
    video_prompt: >
      The hard black shadow edge lying across the ground moves slowly and
      steadily toward the camera for the whole shot, and the lit ground in
      front of it gets narrower as it comes. Nothing else in the frame moves.
      The sun does not move and the camera does not move.
    negative_extra: >
      dust in the air, haze, glowing horizon, atmosphere, lens flare, sun
      moving, stars moving, terrain changing shape
    anchors: [A1-crater-lowsun]
    # Batch 1: seed 22 came back with a line of boot prints across the
    # regolith and seed 11 with a rift cut through the middle distance, which
    # is a second void in a record that already has one and puts it at 41 m
    # under a drill. Both are the model filling an empty plain with the most
    # statistically likely thing, and neither is fixed by forbidding it —
    # record 03's rule is that a negation only works when the subject does not
    # imply it, and an empty plain implies something. So the surface is
    # described by what it has on it instead.
    prompt: >
      Ground-level wide view across a crater floor of pale grey regolith
      toward a distant mountainous crater rim, a low white sun sitting exactly
      on the rim line at frame right, a hard black shadow edge lying across
      the regolith in the middle distance with nothing inside it, the ground
      itself flat and unbroken and continuous from the bottom of the frame to
      the rim with nothing crossing it and nothing lying on it, its only
      texture the fine even dust and a scatter of shallow dents too small to
      cast much shadow, black sky with small sharp stars above the rim, no
      people

  - id: "1.2"
    scene: 1
    approved_seed: 22    # selected 2026-09-21
    motion_tier: local
    timeline_seconds: 10
    source: ffmpeg_still
    motion: static
    local_motion: drift
    anchors: [A3-macro-hardware]
    prompt: >
      Macro of a round purge valve knob with coarse knurling set into grey
      woven suit fabric, a heavy brushed-aluminium clamp bracket bolted across
      the knob and locking it, fine grey dust settled in the knurling and
      along the fabric stitching, cold white-blue light raking from the left
      and deep shadow on the right, shallow depth of field, nothing in the
      frame loose or hanging and the air in front of the subject completely
      clear, no people

  - id: "1.3"
    scene: 1
    approved_seed: 22    # selected 2026-09-21
    motion_tier: model
    timeline_seconds: 10
    model: workhorse
    generate_seconds: 10
    motion: the tether strap swaying in the vent draft
    motion_tail: motion_tail_event
    # The person-shaped hole. Five bare hooks and one suit, held in frame for
    # ten seconds, is record 04's animal problem in a different shape: the
    # still withholds a person and the model is invited to supply one. The
    # motion is written as translation of one strap and nothing else, and the
    # completions are named. 4.4 is the same rack and carries the same list.
    # Take 1 held the thing that was expensive to hold — the neck opening
    # stayed empty for all ten seconds, no head, no face — and lost the two
    # things that move. The strap did not sway: it grew into a long festoon
    # draped between two hooks by 5 s and was hanging from a different hook by
    # 9.8. And the collar re-folded and changed direction continuously, which
    # on screen reads as a neck turning inside an empty suit, then hardened in
    # the last second from crumpled fabric into a rigid circular ring.
    #
    # That is record 04's completion failure in a quieter register. Kling did
    # not grow a head; it animated the hole where a head would be, which in a
    # record whose whole claim is that the suit is empty is the worse of the
    # two. Take 2 uses the recipe that fixed record 04's 6.1: every sentence
    # is about position, none about shape, and each way the model completed
    # the frame is named.
    #
    # If take 2 breaks the same way, that is two failures and there is no
    # third roll. The documented fallback is record 04's: cut this shot at the
