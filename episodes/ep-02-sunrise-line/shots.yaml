# Record No. 2 — "THE SUNRISE LINE"
#
# Derived from script.md. The script is the source of truth for the words;
# this file is the source of truth for what gets generated and what it costs.
#
# Prompts here are already cleaned per the Prompt Hygiene section of
# script.md: no grain, no legible text, no animal outside shot 7.2. Do not
# copy prompt text out of script.md into a generation call — that text is
# written for a human reader.

episode: ep-02-sunrise-line
runtime_seconds: 272
aspect: "16:9"

# Per-scene runtime, read by scripts/validate.py. Record 1 had these numbers
# hardcoded in the script; a second episode is where that stops working.
scene_runtime: {1: 34, 2: 42, 3: 34, 4: 49, 5: 61, 6: 34, 7: 18}

# Prompt hygiene the validator enforces, beyond the pipeline-wide rules.
# The one that matters here is the animal: the record shows it once, for four
# seconds, and a grazer wandering into any other frame spends the reveal
# before the reveal. Cheap to check in text, expensive to find in a batch.
hygiene:
  allow_grainy: []
  allow_hand: []
  forbid:
    - pattern: '\b(animal|creature|beast|grazer|herd|hoof|hooves|muzzle|fur|eye)\b'
      except: ["7.2"]
      why: the animal appears in 7.2 only
    - pattern: '\b(sunrise|rising sun|sun rises|climbing sun)\b'
      except: []
      why: the sun sits on the horizon and never moves; the title is the only sunrise
    - pattern: '\b(footprint|footprints|paw|claw marks)\b'
      except: ["3.1", "5.4"]
      why: >
        "footprint" reads as a stamped human shoe. 3.1 and 5.4 use it only to
        say there are no toes and no claw marks.

# --- Anchors ----------------------------------------------------------------
# Five, not four. Record 1 established that an anchor locks composition as
# hard as it locks palette, so there is one anchor per camera distance that
# recurs: wide plain, the boundary at mid distance, ground macro, high
# aerial, and long lens through dust. Handing the wide anchor to the macro
# shots is exactly the failure that cost pass 2 of record 1.
#
# Record 1's exteriors had no anchor at all and went to text-to-image,
# because every anchor in that episode was an interior and leaked a bulkhead
# into open space. Here the whole world is exterior, so the anchors carry it
# and the edit tier works normally.

# Material, light and palette only. No camera, no distance, no lens, no
# framing words — those belong to each shot. "Low", "flat" and "wide" are
# terrain here and nowhere else; anything that could be read as a framing
# instruction has been kept out.
anchor_spine: &spine >
  The same world in every frame: a cold arid plain of fine grey-brown grit
  and cracked pale clay, unbroken to the horizon. The horizon line cuts
  straight through the middle of the sun: the bottom half of the disc is
  hidden behind the ground and only the top half of it shows, a small pale
  half-disc resting on the line, dim enough to look at, with no flare and no
  glow around it. The light comes in level along the ground. Where there
  is a sky it is flat featureless pale haze, the same colourless grey-white
  from the horizon to the top of the frame, with no gradient, no clouds, no
  stars and no blue anywhere in it. Fine dust hangs in the air. The ground is
  untouched: no ruts, no tread marks, no tyre prints, no paths, no roads.
  Where vegetation appears it is a low dark olive crust of tiny wiry stems
  lying flat against the ground, never bushes, never shrubs, never grass
  tufts, never trees. Desaturated palette: grey-brown ground, dull rust, pale
  blue-grey frost. No saturated colour, no lush green, no daylight blue. The
  world is empty: no people, no animals, no buildings, no machinery, no
  vehicles, no fences, no metal, no debris. Nothing manufactured is lying on
  the ground: no barrel, no drum, no rusted ring, no pipe, no tank, no post.
  No lettering, no numbers, no signage and no graphics of any kind anywhere
  in frame.

# Used for any shot routed to text-to-image instead of the edit tier. On this
# episode that is the aerial pair, where an eye-height reference fights the
# altitude harder than the prompt can win it back.
exterior_spine: &exterior_spine >
  Looking straight down from an aircraft at three thousand metres onto a cold
  arid plain of fine grey-brown grit and cracked pale clay. The ground fills
  the entire frame from edge to edge: no horizon, no sky, no sun and no
  skyline anywhere in the picture. Level light from very low down rakes
  across the surface, thin haze between the camera and the ground.
  Desaturated grey-brown, rust and pale blue-grey palette, no saturated
  colour. The land is untouched wilderness: no fields, no cultivated land, no
  roads, no tracks of vehicles, no quarry, no mine, no buildings, no
  machinery, no people, no animals. No lettering or graphics of any kind.

# Approved 2026-09-09. Four passes; every candidate from all four is kept
# under anchors/pass-N/ so a later "why does this world look like this" has an
# answer. approved_seed plus the prompt in this file reproduces the approved
# image exactly — but note that A1/A2 were approved from pass 3 and A3/A4 from
# pass 4, and the prompts in this file are the pass 4 text. A5 came from pass 2
# and its prompt has not changed since. Do not regenerate an approved anchor:
# everything downstream is built against these five frames.
#
# The known flaw in the set, recorded because it will show up in stills: the
# model treats this ground as driveable, and faint tread marks survive in the
# near foreground of A1 and in one band of A3. Four passes did not remove them.
# Shot framing keeps them out of most plates; where one appears in a still,
# reject the still rather than reworking the anchor.

# What the animal's track looks like. Reused verbatim everywhere a track
# appears, which is the point: scene 3 failed because the track was only ever
# described by what it is not, and an enhancer filling that gap reaches for
# the statistically typical mark on soft ground — a boot sole or a tyre.
# One sentence, positive, in every shot that shows one.
# The world at ground level, in words, for shots that go to text-to-image
# because no reference helps them. Same material, light and palette as the
# anchor spine, with the camera left out — a shot still says its own distance.
ground_spine: &ground_spine >
  Close to the ground on a cold arid plain: fine grey-brown soil and grit,
  pale cracked clay, dull rust staining, patches of pale blue-grey frost. The
  light comes in almost level from a sun sitting on the horizon far away, so
  everything is picked out by long raking shadows and the surface relief reads
  strongly. Desaturated palette, no saturated colour, no lush green. Natural
  untouched ground, irregular everywhere, nothing rolled, ploughed or combed
  across it. No people, no animals, no machinery, no vehicles, no lettering.

# Version 3, and the last thing tried before the storyboard changes instead.
#
# Two changes, both from what the failures had in common. The negation list is
# gone entirely: v2 forbade tread, lugs, ribs and grooves by name and got all
# four, which is record 1's "no signage" lesson at full strength — a list of
# things not to draw is a list of things. And the word "track" is gone from
# every prompt in this family, because in English it is a vehicle word, and it
# had been sitting in every prompt that came back as a tyre rut or a tracked
# belt since the first pass.
#
# What is left is one positive sentence about scale and material. Nothing
# about what the mark is not.
track_canon: &track_canon >
  The mark is a shallow oval print in the soil, about the width of two hands
  and sunk two or three centimetres, its floor made of the same grit and
  crossed by the same fine hairline cracks as the ground around it, its edges
  crumbled and uneven.

# Appended to every image-to-video prompt. The approved still already carries
# the subject, the light and the framing; the video prompt's only job is to
# say what moves. Two tails, because a shot that must not move and a shot
# that must move slowly need opposite instructions — record 1 proved that
# using one tail for both tells a locked-off shot it is supposed to travel.
motion_tail_static: &motion_tail_static >
  The camera does not move at all. This is a locked-off tripod shot: the
  framing at the last frame is identical to the framing at the first. No
  dolly, no push in, no pull back, no pan, no tilt, no drift, no parallax.
  Only light and airborne dust change. Nothing enters the frame, no new
  objects appear, no animal appears, the sun does not rise or move.

motion_tail_moving: &motion_tail_moving >
  The movement is extremely slow, continuous and even, and covers only a very
  short distance across the whole shot. Nothing else in the frame moves. No
  cuts, no speed changes, no zoom snaps. Nothing enters the frame, no new
  objects appear, no animal appears, the sun does not rise or move.

anchors:
  - id: A1-plain-wide
    model: anchor
    approved_seed: 11          # pass 3, approved 2026-09-09
    approved_file: anchors/A1-plain-wide.jpg
    covers: ["1.1", "1.4", "2.5", "4.6", "6.1", "6.4"]
    spine: *spine
    subject: >
      Camera: 35mm lens at standing eye height, level, horizon across the
      lower third, the sun half sunk into that horizon slightly off centre.
      Wide establishing shot. Subject: open flat ground running unbroken to
      the horizon, its surface smooth and undisturbed with nothing standing on
      it and nothing to cast a long shadow across it — the low light picks out
      only the shallow relief of the ground itself. Thin haze softening the
      far distance.
    note: >
      Pass 1: "shadow bands from low ridges of grit stretching toward the
      camera" came back as five hard converging spokes that read as roads
      meeting at the sun, with tyre ruts in the foreground. The frame has
      nothing in it to cast a shadow, so asking for shadows asked the model to
      invent the objects — and it invented infrastructure.

  - id: A2-boundary
    model: anchor
    approved_seed: 33          # pass 3, approved 2026-09-09
    approved_file: anchors/A2-boundary.jpg
    covers: ["2.1", "2.2", "2.3", "2.4", "4.4"]
    spine: *spine
    subject: >
      Camera: 50mm lens at chest height, looking across the ground rather than
      along it, the three bands stacked in the frame, the near ground running
      unbroken to the bottom edge with nothing lying on it. Mid shot. Subject: dry
      scorched cracked clay in the near ground, a narrow strip of dark olive
      low vegetation across the middle, pale blue-grey frost beyond it, the
      change from one to the next happening over a few metres.
    note: >
      A rusted metal ring keeps appearing in the near ground — pass 1 seed 33
      and pass 2 seed 11, unprompted both times. The spine now forbids it by
      name. Record 1 found the same behaviour: an enhancer fills an empty
      foreground with whatever is statistically typical, and the fix is to say
      which object, not to say "empty".

  - id: A3-ground-macro
    model: anchor
    approved_seed: 22          # pass 4, approved 2026-09-09
    approved_file: anchors/A3-ground-macro.jpg
    covers: ["1.3", "3.1", "3.2", "3.3", "3.4", "4.1", "4.5", "5.4"]
    spine: *spine
    subject: >
      Camera: 100mm macro directly overhead, pointing straight down at the
      ground, perpendicular to it. The surface is parallel to the film plane,
      so every part of the picture is the same distance from the lens: a flat
      overhead view with no perspective, no receding ground, no vanishing
      lines, no horizon, no sky and no sun anywhere in it. The frame covers
      roughly one metre of surface and nothing else, the soil filling it edge
      to edge. Subject: damp fine-grained soil, its surface
      whole and undisturbed — bare grit, a faint sheen of moisture, hairline
      cracks and the shallow relief of the grain itself, picked out by raking
      light from one side. The surface is irregular and natural everywhere:
      no ribbed band, no corrugation, no repeating parallel ridges, no evenly
      spaced grooves, no herringbone pattern, no tyre tread, nothing rolled or
      combed across it. The ground is not dug and not broken: no hole, no pit,
      no crater, no hollow, no dip, nothing scooped out of it. No painted
      line, no white stripe, no kerb, no verge, no moss, no lichen.
    note: >
      Two passes lost to one word. "One broad shallow depression pressed into
      it" returned a two-metre crater seen from standing height in all three
      seeds of pass 1, and stating its size in centimetres in pass 2 made the
      craters bigger — the model reads any dished ground as a pit and then
      pulls the camera back far enough to show the whole thing, which takes
      the anchor's distance with it.

      So the anchor no longer contains a track at all. It carries the
      distance, the soil and the light, which is what an anchor is for; the
      tracks are described in the shots that need them (3.1, 3.2, 5.4, 6.2),
      where a wrong one costs $0.04 instead of a whole anchor pass.

      Pass 5, after scene 3. The approved pass 4 frame carried a band of
      ribbed tread across the middle — visible at approval, accepted as
      cosmetic, and it turned out not to be: every shot referencing A3 came
      back with that band in it, and 3.1's shallow track became a raised ring
      beside it. The repeating patterns are now forbidden by name, one clause
      per shape the model reaches for.

  - id: A4-aerial
    model: anchor
    approved_seed: 22          # pass 4, approved 2026-09-09
    approved_file: anchors/A4-aerial.jpg
    covers: ["5.1", "5.2", "5.3"]
    spine: *spine
    subject: >
      Camera: looking straight down from an aircraft at three thousand metres,
      perfectly vertical. The ground is parallel to the film plane and every
      part of the picture is the same distance from the lens — a flat overhead
      view, no perspective, no receding ground, no vanishing point. The ground
      fills the entire frame edge to edge: no horizon, no skyline, no sun and
      no sky in the picture at all. Subject:
      the plain seen from directly above, its surface reading as flat texture,
      two faint pale lines worn across it running roughly parallel and
      disappearing off opposite edges of the frame, thin haze between the
      camera and the surface.
    note: >
      Pass 1 read "a slight lean so the horizon sits at the top edge" as
      permission to tilt, and returned a hillside in two seeds and an open-cut
      mine with a bulldozer, sheds and invented lettering in the third. The
      horizon is out of the frame entirely now, and the exterior spine names
      the industrial furniture that has to stay out.

      Pass 3 still put the sun and a band of haze along the top edge: "looking
      straight down" was read as a steep oblique. Pass 4 states the geometry
      instead of the intent — the ground parallel to the film plane, every
      part of the frame equally distant — which is the same fix A3 needed, and
      for the same reason.

  - id: A5-longlens-haze
    model: anchor
    approved_seed: 33          # pass 2, approved 2026-09-09
    approved_file: anchors/A5-longlens-haze.jpg
    covers: ["7.1", "7.2", "7.3", "7.4"]
    spine: *spine
    subject: >
      Camera: 400mm long lens at eye height, heavily compressed perspective,
      shallow depth of field, focus on a band of ground in the middle distance
      with drifting dust between camera and subject softening everything.
      Ground occupies the lower two thirds of the frame; the horizon is
      squeezed flat and sits high. Subject: empty ground and one low ridge
      line, the compressed dust stacking into flat pale horizontal layers, no
      vegetation of any kind in frame.

# --- Shots ------------------------------------------------------------------
# Locked-off shots are built from their approved stills in ffmpeg, per
# CLAUDE.md: steadier than any model, exactly 1920x1080, exactly the right
# duration, no cost. Everything with real movement goes to Kling. Seedance is
# not used.
#
# The data cards in script.md are composited in post over the plates named in
# cards.yaml. Those plates are framed with a clean lower third or clean lower
# left on purpose — a card dropped onto a busy frame is unreadable, and there
# is no fixing it after the still is approved.

shots:
  # SCENE 1 — COLD OPEN (34 s)
  - id: "1.1"
    scene: 1
    timeline_seconds: 10
    source: ffmpeg_still
    motion: static
    anchors: [A1-plain-wide]
    card: aldren-card          # planetary card builds over this shot
    prompt: >
      Open arid plain running unbroken to the horizon, the sun a small pale
      disc sitting exactly on that horizon, long shadow bands reaching toward
      the camera and running out of the bottom of the frame, thin haze, the
      lower left quarter of the frame empty flat ground with nothing in it,
      wide static shot

  - id: "1.2"
    scene: 1
    timeline_seconds: 8
    generate_seconds: 10       # Kling does 5 or 10 only
    trim_to: 8
    model: workhorse
    motion: lateral dust drift
    anchors: [A1-plain-wide]
    note: >
      First pass put the dust on the horizon, where it read as a line of
      distant scrub rather than as moving air — the shot is the only evidence
      in the record that anything on this world moves at all, so the dust has
      to be near the camera and separable from the ground behind it.
    prompt: >
      A low ribbon of fine dust blowing across the middle of the frame close
      to the camera, its streaks lit from the side and clearly separated from
      the ground, the ground behind it flat, empty and thrown out of focus,
      the horizon far back and soft. No bushes, no scrub, no vegetation on the
      horizon, nothing settling, no dunes, no heaps. Mid shot
    video_prompt: >
      Only the airborne dust moves, travelling steadily sideways across the
      frame from one edge to the other. The ground, the light and the horizon
      are completely still.

  - id: "1.3"
    scene: 1
    timeline_seconds: 8
    source: ffmpeg_still
    motion: static
    anchors: [A3-ground-macro]
    prompt: >
      Close on cracked dry clay, the raking light from a sun on the horizon
      throwing hard shadow edges out of every crack, fine grit caught along
      the ridges, macro shot, shallow focus, static

  - id: "1.4"
    scene: 1
    timeline_seconds: 8
    source: ffmpeg_still
    motion: static
    anchors: [A1-plain-wide]
    prompt: >
      The horizon line alone, thin haze stacked into flat pale layers above
      it, the sun sitting on the line as a small pale disc, no cloud and no
      detail in the sky, the ground a narrow dark strip along the bottom,
      static shot

  # SCENE 2 — THE LINE (42 s)
  - id: "2.1"
    scene: 2
    timeline_seconds: 10
    generate_seconds: 10
    model: workhorse
    motion: slow lateral track
    anchors: [A2-boundary]
    prompt: >
      Scorched cracked clay in the near ground, a narrow strip of dark olive
      low vegetation across the middle distance, pale blue-grey frost beyond
      it, all three bands parallel across the frame, raking light, mid shot
    video_prompt: >
      The camera tracks sideways, very slowly and evenly, parallel to the
      three bands, so that the bands stay exactly where they are in the frame
      and only the ground slides past. No push in, no pull back, no rotation.

  - id: "2.2"
    scene: 2
    timeline_seconds: 8
    generate_seconds: 10
    trim_to: 8
    model: workhorse
    motion: very slow push
    anchors: [A2-boundary]
    prompt: >
      The frost edge close up, a thin ragged line of pale blue-grey rime
      against dark damp ground, a faint sheen of meltwater along it, raking
      light, no vegetation in frame, close shot
    video_prompt: >
      An extremely slow push straight in toward the frost edge, travelling
      only a very short distance across the whole shot. The frost line stays
      centred. Nothing melts visibly, nothing flows, no water pools appear.

  - id: "2.3"
    scene: 2
    timeline_seconds: 8
    source: ffmpeg_still
    motion: static
    anchors: [A2-boundary]
    prompt: >
      The scorched side alone, pale clay broken into hard polygonal plates
      curling at their edges, dry grit in the gaps, no vegetation anywhere,
      hard raking light, static shot

  - id: "2.4"
    scene: 2
    timeline_seconds: 8
    source: ffmpeg_still
    motion: static
    anchors: [A2-boundary]
    card: temperature-profile
    note: >
      Chart plate. The vegetation strip sits in the upper half and the lower
      third is clean ground, because the temperature profile is drawn across
      the bottom of the frame.
    prompt: >
      The strip of dark olive low vegetation seen across the middle distance,
      sparse and even, the lower third of the frame nothing but flat open
      ground, thin haze behind, mid shot, static

  - id: "2.5"
    scene: 2
    timeline_seconds: 8
    source: ffmpeg_still
    motion: static
    anchors: [A4-aerial]
    note: >
      Third attempt, rewired to the aerial anchor. The scene needs one frame
      that shows the band as a band, and at eye height that means a vanishing
      point, which is what produced the causeway and the people twice. Seen
      from altitude the recession is diagonal across the frame instead of into
      it: no vanishing point to fill in, no horizon in the picture at all, and
      the one camera position in the scene that appears nowhere else in it.

      First pass returned a raised causeway running to the sun with a file of
      people walking along it, in both seeds. "Running away to the horizon"
      and "converging into haze" describe a vanishing point, and a vanishing
      point in an empty landscape is a road — which then gets travellers. The
      spine's "no people" lost to the composition, the same way "no signage"
      lost on record 1. The band now recedes as three parallel stripes with
      the emptiness stated in the shot itself, not only in the spine.
    prompt: >
      Seen from an aircraft looking down at the ground, the three bands
      running diagonally across the picture from one corner to the other: dry
      pale cracked ground, a dark line of low vegetation, and frost catching
      the low light, side by side, thinning into haze toward the far corner.
      The ground fills the whole frame — no horizon, no skyline, no sun and no
      sky in the picture. The land is completely deserted: no people, no
      figures, no silhouettes, no path, no causeway, no embankment, no track,
      no road. Static aerial shot

  # SCENE 3 — THE MARGIN (34 s)
  - id: "3.1"
    scene: 3
    timeline_seconds: 8
    source: ffmpeg_still
    motion: static
    anchors: []
    exterior: true            # no reference: A3 injects tread, see below
    spine_key: ground_spine
    track_canon: *track_canon
    prompt: >
      A single shallow print in damp fine-grained soil, alone in an otherwise
      undisturbed surface. Photographed from directly above with the
      camera pointing straight down, the frame covering about half a metre of
      ground and nothing else — no horizon, no sky and no distance in the
      picture. Hard raking light from one side across the whole frame, static

  - id: "3.2"
    scene: 3
    timeline_seconds: 8
    source: ffmpeg_still
    motion: static
    anchors: []
    exterior: true            # no reference: A3 injects tread, see below
    spine_key: ground_spine
    track_canon: *track_canon
    prompt: >
      Two or three older prints of that same kind in the same ground, spaced
      well apart, their edges dried pale and beginning to split, fine cracks
      running out of them across the surface, the soil between them lighter
      and drier, raking light, ground level close shot

  - id: "3.3"
    scene: 3
    timeline_seconds: 10
    source: ffmpeg              # three approved plates, cross-dissolved
    plates: ["3.3a", "3.3b", "3.3c"]
    note: >
      The same patch of ground three times: damp, dry, split. Generated as
      video it would be three different patches — a texture change over time
      is exactly what an image-to-video model rewrites. Three stills from one
      approved plate, dissolved locally, keeps it the same square metre.
      3.3b and 3.3c are generated with ref_shot 3.3a so the geometry holds.
    anchors: []
    exterior: true
    spine_key: ground_spine
    track_canon: *track_canon
    prompt: >
      Damp fine-grained soil filling the frame with one such print in it, raking light from the side, macro, static
    plate_prompts:
      "3.3b": >
        The same patch of ground, now dried out: the same print in the same
        place, the surface gone pale and matte, the damp sheen gone. Nothing
        moves and nothing else changes.
      "3.3c": >
        The same patch of ground, now split: the same print in the same place,
        the surface broken into hard curling plates with open cracks between
        them. Nothing moves and nothing else changes.

  - id: "3.4"
    scene: 3
    timeline_seconds: 8
    source: ffmpeg_still
    motion: static
    anchors: [A3-ground-macro]
    card: margin-countdown
    note: >
      Bar plate. Deliberately the emptiest frame in the scene — the MARGIN bar
      drains across the lower third and needs uninterrupted ground under it.
    prompt: >
      Flat open ground filling the frame evenly, fine grit and shallow
      cracks, no tracks and no vegetation, even raking light, nothing in the
      lower third but ground, static shot

  # SCENE 4 — THE COST (49 s)
  - id: "4.1"
    scene: 4
    timeline_seconds: 8
    source: ffmpeg_still
    motion: static
    anchors: [A3-ground-macro]
    prompt: >
      Low dark olive stems close up, every one of them cropped off at the same
      height in a clean level line, the cut ends pale, bare soil visible
      between them, raking light, macro, static

  - id: "4.2"
    scene: 4
    timeline_seconds: 9
    source: ffmpeg_still
    motion: static
    anchors: [A1-plain-wide]
    card: energy-budget
    note: Bar plate. Clean lower left; the stacked bar builds there.
    prompt: >
      A band of low dark olive vegetation running straight away from the
      camera to the horizon, one side of it cropped short in an unbroken
      straight line and the other side untouched and taller, the difference
      running all the way into the haze, wide static shot

  - id: "4.3"
    scene: 4
    timeline_seconds: 10
    generate_seconds: 10
    model: workhorse
    motion: very slow drift
    anchors: [A1-plain-wide]
    note: >
      The herd. It must stay unresolved — the record shows the animal once,
      in 7.2, and anything legible here spends the reveal early. If a take
      comes back with a readable body, reject it rather than trying to fix it
      in the grade.
    prompt: >
      Several dark shapes in the far distance, small, low and completely
      unresolved in thick haze, no legs and no bodies distinguishable, flat
      ground between them and the camera, long lens compression, wide shot
    video_prompt: >
      The distant shapes drift very slowly sideways together, staying the same
      size and staying unresolved. The camera does not move. No shape comes
      closer or becomes clearer, and nothing enters the foreground.

  - id: "4.4"
    scene: 4
    timeline_seconds: 8
    generate_seconds: 10
    trim_to: 8
    model: workhorse
    motion: trickle
    anchors: [A2-boundary]
    prompt: >
      Meltwater running in a thin thread out from under a ragged frost edge,
      dark wet soil below it, pale rime above, raking light catching the
      surface of the water, close shot
    video_prompt: >
      Only the thread of water moves, running steadily and slowly downhill.
      The frost edge, the soil and the light are still. No splashing, no
      pooling, no widening stream, no wet reflections spreading.

  - id: "4.5"
    scene: 4
    timeline_seconds: 7
    source: ffmpeg_still
    motion: static
    anchors: [A3-ground-macro]
    prompt: >
      Low dark olive vegetation from just above, flat even light, thin stems
