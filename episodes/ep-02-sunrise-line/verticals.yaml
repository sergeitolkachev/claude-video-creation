# The vertical cuts. Three, carved from EPISODE-clean.mp4 — the graded master
# with no overlays on it.
#
# **No data cards in a vertical.** A card is composed for the lower left of a
# 16:9 frame and a 9:16 crop takes 608 px of width out of 1920; the ALDREN card
# alone is about 1000 px wide. Anchoring the crop left instead of centre would
# save the first two words of every line and cut the numbers off — which is the
# half worth keeping. So a vertical carries the picture, the voice, the wind
# and the slug, and nothing else. The full record is where the numbers live.
#
# Each one stops mid-sentence. The last thing heard has no resolution after it.

source: out/EPISODE-clean.mp4
audio: audio/episode-mix-noclicks.mp3
crop: centre                 # 608x1080 out of 1920x1080, scaled to 1080x1920
slug: "FC9-002 // THE SUNRISE LINE"

cuts:
  - id: fc9-002-b-the-line
    from: 50.0
    to: 72.2
    covers: [2.2, 2.3, 2.4, 2.5]
    ends_on: "Faster than anything can afford to ig—"
    note: >
      The band and the arithmetic of it. Cuts inside the last word, so the
      sentence that explains the whole record is the one the viewer does not
      get to finish.

  - id: fc9-002-c-the-margin
    from: 78.0
    to: 99.2
    covers: ["3.1", "3.2", "3.3"]
    ends_on: "the ground you are standing on is on f—"
    note: >
      Carries the drying-ground dissolve, which is the one piece of motion in
      the record that is neither camera nor animal.

  - id: fc9-002-d-the-distance
    from: 223.0
    to: 250.5
    covers: ["6.1", "6.2", "6.3"]
    ends_on: "The animal is not travelling any—"
    note: >
      The strongest number in the record — twice the Earth–Moon distance,
      walked in a circle — and then the line that takes it away.
