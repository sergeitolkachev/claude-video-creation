# Burned-in titles — channel furniture only. The episode's data graphics are
# in cards.yaml; these are the slug and the closing card, in the same Menlo,
# same size, same corner as every other record.
#
# Times are absolute seconds on the 279 s timeline. Titles are not tied to a
# plate the way a data card is — the slug belongs to the record, not to the
# shot it happens to land on — so these stay absolute.
#
# Rendered by build_cards.py --titles, in the same phosphor, the same Menlo and
# the same typing as every other character on the channel.

cards:
  - id: slug
    at: 1.0
    hold: 6.0
    lines: ["FC9-002 // THE SUNRISE LINE"]

  - id: survey-stamp
    at: 34.0
    hold: 5.0
    lines: ["RECONSTRUCTED SURVEY", "ALDREN — EQUATORIAL BAND"]

  # Close. Under the grain, like everything else.
  - id: close-1
    at: 268.0
    hold: 7.0
    size: 34
    pos: centre
    alpha: 235
    lines:
      - "FILE CLASS NINE"
      - "FC9-002 // THE SUNRISE LINE"
      - ""
      - "Reconstructed survey. No such world is on record."
