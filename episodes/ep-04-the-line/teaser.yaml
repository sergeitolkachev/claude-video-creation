# The thirty-second teaser. Built from scratch, posted before the record
# exists, and the only piece on this channel allowed a cue under it.
#
# Its one job is to stop a thumb in the first second, so it opens on the animal
# — the only thing in this record that is alive and moving — with the flattest
# sentence in the script over it. Then it escalates on the record's own
# arithmetic and stops before the explanation: nothing here says why anything
# comes apart.
#
# Three rules it does not break:
#
#   Voice   Nothing is generated. Every line is a take already in the record,
#           already approved, reproducible from its seed. A teaser that speaks
#           a sentence the episode does not contain is the audio version of a
#           thumbnail promising a frame that is not there.
#
#   Facts   Every figure spoken here is one the record states and the appendix
#           separates into real and invented. The 8,200 m line is real; the
#           specimen is not, and the teaser never claims otherwise.
#
#   Music   Generated, never licensed, and it stays here. Music never goes
#           under the record itself.
#
# Timing is absolute, in seconds, on the teaser's own timeline.

runtime_seconds: 30.0
aspect: "9:16"
slug: "FC9-004 // THE LINE"

# Two closing cards exist on this channel and they are not interchangeable.
# The vertical CUTS carry "WATCH THE FULL RECORD ON THE CHANNEL", because by
# the time a cut is posted the record is up and the card is an instruction.
# The teaser carries SOON, because it goes out before the record exists and a
# card promising something that is not there yet is the one promise a channel
# cannot take back.
end_card:
  at: 26.0
  seconds: 4.0
  lines: ["SOON", "ON THE CHANNEL"]

# Every shot is a take out of takes/, framed where its subject is. The order is
# the teaser's own: the animal first, because a scrolling thumb does not wait
# for an establishing shot.
shots:
  - {id: "6.1", at:  0.0, from: 0.0, seconds: 4.0, crop_x: 0.30, crop_to: 0.40}
  - {id: "2.2", at:  4.0, from: 1.0, seconds: 5.0, crop_x: 0.42}
  - {id: "3.2", at:  9.0, from: 1.0, seconds: 4.0, crop_x: 0.45}
  - {id: "5.1", at: 13.0, from: 2.0, seconds: 4.0, crop_x: 0.36}
  - {id: "1.4", at: 17.0, from: 0.5, seconds: 3.0, crop_x: 0.40}
  - {id: "6.2", at: 20.0, from: 1.0, seconds: 3.0, crop_x: 0.36}
  - {id: "6.4", at: 23.0, from: 2.0, seconds: 3.0, crop_x: 0.40}

# Five lines, in the record's own words, each one strange without the one
# before it and none of them explaining another.
lines:
  - {pid: s1p1, at:  0.2}    # "...there are no fish. Not fewer. None."
  - {pid: s5p1, at:  6.2}    # "Osmotic pressure does not count mass. It counts particles."
  - {pid: s5p4, at: 11.6}    # "It is, osmotically, a shallow-water fish."
  - {pid: s6p1, at: 16.0}    # "The chain is held together by pressure."
  - {pid: s6p3, at: 22.6}    # "Nothing has reached the surface alive."

# The cue measured -13.7 dBFS on its own and the voice takes sit near -17.8, so
# -16 puts the music about 12 dB under the narration: present, never competing.
# The room tone keeps the record's own trim so the teaser sounds like the thing
# it is advertising.
levels:
  music: -16
  tone: 5
  voice: 0

music: sfx/teaser-music.mp3
