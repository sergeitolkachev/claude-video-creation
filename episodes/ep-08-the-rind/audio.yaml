# Record 08's mix. The first record on the new bed (CLAUDE.md, Audio Rules):
# the synthesised floor and one music cue under the whole record, ducked 7 dB
# under the voice by config/sound.yaml, and eight spot effects in the pauses.
#
# Stage 7 checks the pause table against the real takes and sets the levels,
# measured against the generated cue and effects.

runtime_seconds: 261
lead_in: 2.0
tail: 3.0
min_gap: 1.2
card_pull: 1.5

# Extra air before specific lines, from script.md's Pacing section, on top of
# the dynamic gap. Every one falls on a paragraph boundary. Approximate until
# the takes exist; validate.py places them for real at stage 7.
hold:
  # Cold open: 1.1 is ten silent seconds; the first line is over 1.2.
  s1p1: 8.0
  # Before "Around seven hundred and thirty milligrams": 2.0 s.
  s2p3: 0.8
  # Before "Nothing down here is thin.": 1.8 s.
  s3p3: 0.6
  # Scene 4 -> 5 cut: 2.5 s.
  s5p1: 0.5
  # The hinge line, silence on both sides: 2.5 s.
  s5p4: 1.3
  # 6.1 is the only appearance and silent for its full 10 s; s6p1 is over 6.2.
  s6p1: 8.0
  # Scene 6 -> 7: no hold needed. 6.4 is 5 s with no voice, so the gap is
  # already longer than the 3.0 s the script asks for, and a hold here would
  # push s7p1 into the coda.

# --- Layers -----------------------------------------------------------------
# floor  — synthesised, config/sound.yaml. Never gated, under every card.
# music  — the record's cue, ducked under every paragraph.
# clicks — mixed by build_cards.py, never by hand.
# events — spot effects in the pauses, below. Not a layer.
#
# Levels are trims on measured files. The cue is unmeasured until it exists:
# record 07's teaser cue at trim 0 sat at about -24 dBFS in the pauses and
# -31 under the voice against a voice at about -20 above 300 Hz, which is the
# demo that was chosen. Measured 2026-10-19: the cue sits at -24 to -31 dBFS
# (>200 Hz, per 10 s) through the body, all of it under 3 kHz, quiet at the
# cold open (-44) and gone by 241 s — the "thinning" ran to silence, so the
# last 20 s of the coda are floor and meltwater only. Trim 0 matches the
# chosen demo. Ice events -23 to -28, melt -52 (lifted +14 at its event).
# clicks: +20, 3 dB under records 05-07's +23 — Serge, 2026-10-19, on the
# first mix with the clicks in: "even a little quieter". The channel's click
# trim from record 08 on (CLAUDE.md, On-Screen Text).
levels: {floor: 0, music: 0, clicks: 20, events: -6}   # events: peaks landed at the voice's and 6.1 hit 0 dBFS at 0

layers:
  floor:
    synth: floor
  music:
    file: sfx/score.mp3
    duck: true

sfx:
  score:
    kind: music
    file: sfx/score.mp3
    seconds: 261
    prompt: >
      Slow, cold, sparse ambient music for a documentary about a lake sealed
      under four kilometres of Antarctic ice. Sustained mid-register strings
      and a soft glassy pad, faint crystalline high tones drifting over them,
      very little bass. No melody, no beat, no drums, no vocals, no swell. One
      gradual thinning across the whole piece, ending almost bare. Quiet
      enough to sit under a calm speaking voice the whole way through.

  # Spot effects. One dry close event with a body each — never a tick, a
  # squeak or anything electronic (CLAUDE.md, Audio Rules).
  ice_a:
    file: sfx/ice-a.mp3
    seconds: 3
    prompt: >
      A single deep creak and soft crack of thick glacial ice settling under
      heavy load, recorded close in a dead quiet space. Low and woody, ending
      in a short dull thud. Dry, no echo, no ringing, no high-pitched squeak,
      nothing electronic.
  ice_b:
    file: sfx/ice-b.mp3
    seconds: 3
    prompt: >
      A slow low groan of dense ice shifting under pressure, ending in one
      muffled crack, recorded close. Dry and dead, no echo, no whistle, no
      high-pitched tones, nothing electronic.
  ice_close:
    file: sfx/ice-close.mp3
    seconds: 3
    prompt: >
      Very close: one heavy crack inside a block of ice, a dull deep snap with
      a short grainy settle after it. Dry and dead, no echo, no ringing, no
      high-pitched tones, nothing electronic.
  melt:
    file: sfx/melt.mp3
    seconds: 10
    prompt: >
      Meltwater on a block of ice on a steel bench, recorded close: slow
      irregular single drops landing in a thin film of water, soft and round,
      one every second or two. Dry, no echo, no running stream, no
      high-pitched tones, nothing electronic.

# Where the ice is heard: script.md, Sound design. All on silent shots, none
# in scene 5. `level` is a trim on top of levels.events.
events:
  - {sfx: ice_a,     shot: "1.1", at: 2.5}
  - {sfx: ice_b,     shot: "1.1", at: 6.5}
  - {sfx: ice_a,     shot: "2.3", at: 6.5, level: -3}   # 7.5 ran into s2p3
  - {sfx: ice_b,     shot: "3.4", at: 7.5, level: -3}
  - {sfx: ice_a,     shot: "4.4", at: 7.5, level: -3}
  - {sfx: ice_close, shot: "6.1", at: 2.0, level: -2}   # closer than the rest, but its crack peaked at -2 dBFS at +2
  - {sfx: ice_b,     shot: "6.1", at: 6.5}
  - {sfx: melt,      shot: "8.2", at: 0.5, seconds: 8, level: 20}   # file is -52 dBFS; lifted to sit with the ice

clicks_bed: cards/clicks-bed.m4a

# --- Teaser -----------------------------------------------------------------
# The teaser's own cue: thirty seconds, composed with a build, never the
# record's cue and never under the record.
teaser_sfx:
  teaser_music:
    kind: music
    file: sfx/teaser-music.mp3
    seconds: 30
    prompt: >
      Slow, cold ambient music for a documentary trailer about a lake sealed
      under four kilometres of Antarctic ice. Sustained mid-register strings
      and a glassy pad over a faint low pulse, thin crystalline high tones,
      and one gradual tightening across the whole piece that never resolves.
      No melody, no drums, no vocals. Quiet enough to sit under a calm
      speaking voice the whole way through.
