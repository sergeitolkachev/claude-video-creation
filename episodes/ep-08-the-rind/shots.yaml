# Record No. 8 — "THE RIND"
#
# Derived from script.md. The script is the source of truth for the words;
# this file is the source of truth for what gets generated and what it costs.
#
# Prompt text here is already cleaned for the hygiene rules below. Camera
# moves for ffmpeg shots live in `local_motion`, never in the still's prompt:
# a still has no camera move, and "slow push in" in an image prompt is a
# motion word the model reads as something moving. The motion of a model shot
# lives in `video_prompt`, never in `prompt`, for the same reason.
#
# Intake changes against the submitted draft are listed in script.md,
# "Corrections on intake". Shot ids here are the corrected ones.

episode: ep-08-the-rind
runtime_seconds: 261
aspect: "16:9"

# Third person, present tense: the channel narrator.
voice: narrator

# Summed from the shots below, never from prose. Scene 7 is the draft's 7.1
# alone, lengthened to 10 s; scene 8 is the card block, no voice.
scene_runtime: {1: 34, 2: 38, 3: 40, 4: 40, 5: 40, 6: 35, 7: 10, 8: 24}

# Scene 8: five shots, two cards and the closer, no voice. Declared.
coda: [8]

# --- Prompt hygiene ---------------------------------------------------------

hygiene:
  allow_grainy: []
  allow_hand: []
  forbid:
    # Rule 1 — nothing moves in a frame that will never be animated. Twenty-two
    # shots are built in ffmpeg from one approved still. Ice under a beam is
    # where the image models put running water, drops and vapour whether or
    # not it was asked for, so the plates say "glassy and still" instead and
    # none of these words appears in them. The exception list is exactly the
    # nine model shots. Bubbles are allowed everywhere: a bubble frozen in ice
    # is an object, not a motion.
    - pattern: '\b(drift\w*|float\w*|motes?|dust|suspended|vapou?r|mist|steam|smoke|condensation|meltwater|drips?|dripping|drops?|beads?|beaded|trickl\w*|stream\w*|running|runs|flow\w*|thaw\w*|melt\w*|sublimat\w*|moving|moves|rising|rises|travel\w*|crossing|particles?|specks?)\b'
      except: ["2.3", "4.4", "6.1", "6.4", "8.2",
               # 1.1, 3.1, 4.1 and 5.3 became local after their Kling rolls
               # failed; the words describe the approved plates, kept as is.
               "1.1", "3.1", "4.1", "5.3"]
      why: >
        A shot built from a single still must contain nothing that the eye
        expects to see move. Record 04 paid for twelve plates to learn it.

    # Rule 2 — nothing a model can write on.
    - pattern: '\b(text|lettering|writing|written|label\w*|plaque|placard|nameplate|stencil\w*|serial|legible|numerals?|digits?|figures?|readout|markings?|scale|dial|gauge|counter|display|screen)\b'
      except: []
      why: >
        Every character on this channel comes out of build_cards.py. The
        draft's 3.2 said "no display" — the noun is enough to summon one.

    # Rule 3 — an assembly note is not a prompt.
    - pattern: '\b(card|plate|caption|title|overlay)\b'
      except: []
      why: >
        Which shots carry a card is cards.yaml's business.

    # Rule 4 — the light has no fixture. "One hard white source held close"
    # is a light, not an object, and a noun for it puts a torch in frame.
    - pattern: '\b(lamp|lantern|bulb|torch|flashlight|spotlight|headlamp)\b'
      except: []
      why: >
        A spine that names a lamp puts it in eight anchors of fifteen
        (record 03).

    # Rule 5 — one palette.
    - pattern: '\b(warm|amber|orange|yellow|gold\w*|tungsten|sodium|candle\w*|fire|sunlight|green|red)\b'
      except: []
      why: >
        Pale blue-grey, bone white, black, dull steel. Green belongs to the
        cards alone.

    # Rule 6 — nobody is here.
    - pattern: '\b(person|human|figure|hands?|fingers?|gloves?|diver)\b'
      except: []
      why: >
        "No people" ends prompts and is not matched here.

    # Rule 7 — the lake is never in this record. No shot looks into open
    # water; the only water is meltwater on ice (script.md, Style spine).
    - pattern: '\b(underwater|lake|open water|seabed|lakebed|swimming|submerged)\b'
      except: []
      why: >
        Nobody has reached the water and the camera does not either. It is
        also what keeps this record from looking like FC9-003.

# --- Spine ------------------------------------------------------------------
# Material, light and palette only. No room noun, no camera word — "one hard
# white source held close" is the light; distance belongs to each shot.

spine: &spine >
  Deep glacial ice lit by one hard white source close to it, so the ice glows
  from within where the light enters and falls off to black beyond it. The
  ice is pale blue-grey and very dense, shot through with flattened bubbles
  and fine crystal planes, every cut face wet and glassy. Anything that is
  not ice is scuffed cold stainless steel holding a thin rime of frost. One
  narrow palette: pale blue-grey, bone white, black, dull steel. No colour,
  no lettering, no markings, no people.

# Pass 2 spines (2026-10-19). Pass 1 used `spine` above for every anchor and
# lost two properties across the board: "lit by one hard white source close
# to it" put a light fixture in five of twelve frames — a source is a noun —
# and "glacial ice" came back as stacked ice bricks, an ice-hotel wall, in
# nine of twelve. Two failures, two changes, nothing else touched: the light
# is described only by what it does to the ice, and the ice is one continuous
# mass. A2 was right on pass 1 and keeps `spine`.
ice_spine: &ice_spine >
  Glacier ice as one continuous solid mass, like the inside of a glacier,
  pale blue-grey and very dense, layered with flattened bubbles and fine
  crystal planes. Light comes into the ice from one side; the ice glows from
  within where it enters and falls off to black beyond. Every cut surface is
  wet and glassy. Anything that is not ice is scuffed cold stainless steel
  holding a thin rime of frost. One narrow palette: pale blue-grey, bone
  white, black, dull steel. No colour, no lettering, no markings, no people.

# The macro distance gets its own spine with no steel in it, for the same
# reason record 03 split one out: pass 1's A3 put a steel pot, a steel rod
# and a bench into all three macro frames, because the spine says anything
# that is not ice is steel.
macro_spine: &macro_spine >
  A macro photograph taken inside glacier ice. The ice is one continuous
  mass, pale blue-grey and very dense, layered with flattened lens-shaped
  bubbles and fine crystal planes, glowing from within where light enters it
  from behind and falling off to black at the edges. One narrow palette:
  pale blue-grey, bone white, black. No colour, no lettering, no markings,
  no people.

# gen_stills.py reads `exterior_spine` unconditionally. This record has no
# exteriors; the key points at the one spine.
exterior_spine: *spine

negative_base: >
  fast motion, camera shake, dolly, push in, pull back, pan, zoom, morphing
  geometry, ice reshaping, brightening, blur, distortion, low quality,
  people, text, watermark, underwater scene, fish

# --- Motion tails -----------------------------------------------------------

# Meltwater: every model shot but 2.3, 4.4 and 6.4. The water moves; the ice
# it moves over is rigid and keeps exactly its shape.
motion_tail_water: &motion_tail_water >
  Only the meltwater named above moves, slowly and steadily, and it keeps
  moving for the whole shot. The ice itself is rigid: every edge, bubble,
  crystal plane and surface keeps exactly its shape and position, and
  nothing in the ice changes. The camera does not move at all: no dolly, no
  push in, no pull back, no pan, no tilt, no zoom. No cuts, no speed changes.
  Nothing enters the frame.

# Bubbles carried in or out of a water film: 2.3, 6.4. Small rigid spheres on
# a path, nothing for the model to redraw.
motion_tail_bubbles: &motion_tail_bubbles >
  Only the small bubbles move, each one keeping its round shape as it
  travels, steadily for the whole shot. The ice around them is rigid and
  keeps exactly its shape. The camera does not move at all: no dolly, no push
  in, no pull back, no pan, no tilt, no zoom. No cuts, no speed changes.
  Nothing enters the frame.

# --- Anchors ----------------------------------------------------------------
# Four, one per camera distance that recurs. The draft's A4 ("the mass in
# ice") is not generated: 6.1 is the only shot it covered and it references
# the approved 4.1 instead, as the script asks.

anchors:
  - id: A1-bore
    model: anchor
    approved_seed: 22         # approved by Serge 2026-10-19, pass 2
    approved_file: anchors/A1-bore.jpg
    covers: ["1.1", "3.1", "5.3"]
    note: >
      Pass 1 (s11/s22/s33, all rejected): an ice-hotel tunnel of stacked ice
      bricks with a steel trough down the floor in all three; s11 and s22 put
      the light fixture in frame. s33 was closest — symmetric, no fixture.
      Pass 2: ice_spine, and the bore described as a drilled round tube whose
      floor is the same curved ice as its walls.
      Pass 2: s22 approved. A true round bore, no fixture, no railing,
      the far end black, the left wall glowing. s11 grew steel handrails down
      both sides (a walkway); s33 put a riveted panel on the right wall.
      Known fault: a bright ring around the far opening that could read as a
      rim — judge it in the stills.
    spine: *ice_spine
    subject: >
      Camera: 24mm lens centred inside a narrow round borehole drilled
      through glacier ice, level, looking straight along it, the vanishing
      point in the middle of the frame. The bore is a smooth round tube cut
      through solid ice, its wall one continuous curved surface, wet and
      glassy, flattened bubbles visible inside the wall. Its floor is the
      same curved ice as its walls and nothing stands in it. The near wall
      glows pale blue and the far end falls away to black. The lower left
      quarter of the frame is plain glowing ice wall.

  - id: A2-core
    model: anchor
    approved_seed: 33         # approved by Serge 2026-10-19, pass 1
    approved_file: anchors/A2-core.jpg
    note: >
      Pass 1: s33 is the one. Cylinder right of centre, frost along the
      contact line, lower left empty bench, dark background. s11 lit the cut
      face warm, outside the palette; s22 centred the cylinder. Known fault:
      the core reads as segmented, ice bricks again, faintly.
    covers: ["1.3", "2.2", "2.4", "3.3", "4.1", "4.3", "5.2", "6.3", "7.1"]
    spine: *spine
    subject: >
      Camera: 50mm lens, level, square to the subject, close. Subject: a
      cylinder of pale blue-grey glacial ice about fifteen centimetres
      across, lying on its side on a scuffed stainless steel bench, its cut
      end facing the lens and lit across from the right so the face glows,
      a line of white frost along the contact where ice meets metal. The
      cylinder sits right of centre. The lower left quarter of the frame is
      empty frosted steel bench and nothing else.

  - id: A3-macro
    model: anchor
    approved_seed: 11         # approved by Serge 2026-10-19, pass 2
    approved_file: anchors/A3-macro.jpg
    covers: ["1.2", "1.4", "2.1", "2.3", "3.4", "4.2", "4.4", "5.4", "5.5",
             "6.2", "6.4", "8.1", "8.2", "8.3", "8.4", "8.5"]
    note: >
      Pass 1 (all rejected): none is a macro. Ice cubes in a steel pot (s11),
      a wall of ice bricks beside a lamp (s22), a steel rod over a slab of
      ice (s33). Pass 2: macro_spine, no steel and no light noun, and the
      frame described as only ice.
      Pass 2: s11 approved. Bubbles inside ice, blue, the lower left
      falling to black. s22 has a warm cast at the top; s33 left loose ice
      beads on a surface in front, which a static plate cannot carry. Known
      fault: the bubbles came back round and dense rather than flattened and
      in planes — shot prompts ask for sparse, cloudy and planar where it
      matters.
    spine: *macro_spine
    subject: >
      Camera: 100mm macro lens close to a polished face of ice, the frame
      filled edge to edge with the inside of the ice: flattened lens-shaped
      bubbles lying in parallel planes, the nearest in sharp focus and the
      rest falling off into soft blue. Every part of the frame is ice. Shallow
      depth of field. The lower left quarter is clear ice going darker.

  - id: A5-steel
    model: anchor
    approved_seed: 22         # approved by Serge 2026-10-19, pass 2
    approved_file: anchors/A5-steel.jpg
    covers: ["3.2", "5.1"]
    note: >
      Pass 1 (all rejected): s11 is a plain steel cube with a latch on a
      beige concrete slab, outside the palette; s22 and s33 put a hinged
      cabinet beside a wall of ice bricks. Pass 2: ice_spine, and the floor
      is described as glacier ice to every edge.
      Pass 2: s22 approved. Plain frosted steel box on an ice floor, ice
      formations behind it, falling to black. s11 is flanked by ice bricks
      again; s33 leaks warm light from an open door gap. Known fault: hinges
      on the front face, read as a case rather than blank hardware.
    spine: *ice_spine
    subject: >
      Camera: 50mm lens, level, square to the subject, close. Subject: a
      squat block of scuffed stainless steel and dull anodised grey
      hardware standing on a flat floor of pale glacier ice that runs to
      every edge of the frame, its faces plain and blank, frost along every
      edge, worn through to bare metal at the corners, the light raking low
      across it from the left. Behind it the ice falls to black. The lower
      left quarter of the frame is empty ice floor.

