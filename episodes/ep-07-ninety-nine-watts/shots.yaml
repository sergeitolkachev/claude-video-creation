# Record No. 7 — "THE NINETY-NINE WATTS"
#
# Derived from script.md. The script is the source of truth for the words;
# this file is the source of truth for what gets generated and what it costs.
#
# Prompt text here is already cleaned for the hygiene rules below. Camera
# moves for ffmpeg shots live in `local_motion`, never in the still's prompt:
# a still has no camera move, and "slow drift right" in an image prompt is a
# motion word the model reads as something drifting. The motion of a model
# shot lives in `video_prompt`, never in `prompt`, for the same reason.

episode: ep-07-ninety-nine-watts
runtime_seconds: 267
aspect: "16:9"

# The operator, first person. Named once, here, and read by gen_narration.py,
# build_audio.py and build_captions.py alike.
voice: character

# Summed from the shots below, never from prose. Scene 7 is the draft's 7.1
# alone: log ninety-eight was inside the coda and the exemption covers cards,
# not a spoken line (script.md, correction 2).
scene_runtime: {1: 30, 2: 35, 3: 40, 4: 40, 5: 40, 6: 40, 7: 10, 8: 32}

# Scene 8: five shots, three cards, no voice. Declared, not waived.
coda: [8]

# --- Prompt hygiene ---------------------------------------------------------

hygiene:
  allow_grainy: []
  allow_hand: []
  forbid:
    # Rule 1 — nothing moves in a frame that will never be animated.
    #
    # Fifteen shots are built in ffmpeg from one approved still. An industrial
    # interior is where the image models put dust in the air whether or not it
    # was asked for, so the plates say "the air completely clear" instead, and
    # none of these words appears in them. The exception list is exactly the
    # nineteen model shots.
    - pattern: '\b(drift\w*|float\w*|motes?|dust|suspended|vapou?r|mist|steam|smoke|condensation|sway\w*|swing\w*|turn\w*|rotat\w*|blink\w*|flash\w*|puls\w*|flicker\w*|shimmer\w*|jitter\w*|creep\w*|advanc\w*|travel\w*|moving|moves|particles?|specks?|bubbles?|stepp?\w*|lengthen\w*|emerging|running|crossing)\b'
      except: ["1.2", "1.3", "2.1", "2.3", "2.5", "3.2", "3.4", "4.1", "4.3",
               "4.5", "5.1", "5.3", "6.1", "6.2",
               # 6.4 became local after its still was approved; the words
               # describe what is in the plate, accepted as is.
               "6.4"]
      why: >
        A shot built from a single still must contain nothing that the eye
        expects to see move. Record 04 paid for twelve plates to learn it.

    # Rule 2 — nothing a model can write on. Every instrument in this record
    # implies a scale, and every scale implies numerals; the prompts fill them
    # with plain engraved ticks, a ribbed wheel and a field running to every
    # edge instead of negating the numbers (script.md, correction 7).
    - pattern: '\b(text|lettering|writing|written|label\w*|plaque|placard|nameplate|stencil\w*|serial|legible|numerals?|digits?|figures?|readout|markings?|scale|dial|gauge|counter|register)\b'
      except: []
      why: >
        Every character on this channel comes out of build_cards.py.

    # Rule 3 — an assembly note is not a prompt. The draft carried "no card on
    # this shot" in three prompts; the model reads "card" as an object.
    - pattern: '\b(card|plate|caption|title|overlay)\b'
      except: []
      why: >
        Which shots carry a card is cards.yaml's business.

    # Rule 4 — the lamp appears where it is asked for and nowhere else. A spine
    # that names a lamp puts it in eight anchors of fifteen (record 03).
    - pattern: '\b(lamp|lantern|bulb|torch|spotlight|indicator|lit|glowing)\b'
      except: ["6.1", "6.2", "5.3"]
      why: >
        6.1 and 6.2 are the work lamp; 5.3's bar is the phosphor glowing.

    # Rule 5 — one palette. Cold blue-grey, and the phosphor green that the
    # screens make themselves. No warm light anywhere in this record, the work
    # lamp included.
    - pattern: '\b(warm|amber|orange|yellow|gold\w*|tungsten|sodium|candle\w*|fire|sunlight)\b'
      except: []
      why: >
        A second colour of light is a second location.

    # Rule 6 — nobody is here but the voice.
    - pattern: '\b(person|human|figure|hands?|fingers?|gloves?|operator at)\b'
      except: []
      why: >
        "No people" ends prompts and is not matched here.

    # Rule 7 — the station has no weight. Nothing rests, falls, runs down or
    # settles; things are seated, clipped or held in foam (correction 9).
    - pattern: '\b(resting|lying|fall\w*|drip\w*|runs? down|settl\w*|pour\w*|spill\w*)\b'
      except: ["1.2"]
      why: >
        1.2's needle settles, which is a needle, not gravity.

# --- Spine ------------------------------------------------------------------
# Material, light and palette only. No room noun anywhere in it — no interior,
# no station, no wall, no ceiling — so the same spine serves the macro and
# top-down anchors without putting a room into them. The draft's "coming from
# wide recessed panels" was a light fixture and is gone (correction 11).

spine: &spine >
  Painted steel and anodised aluminium, worn through to bare metal along
  every edge that gets touched. Matte, faintly oxidised, nothing polished and
  nothing new. One palette throughout: cold blue-grey. The light is flat,
  blue-white, low and diffuse, with no visible source anywhere. Contrast is
  low, shadows are soft and shallow, blacks are lifted and never crushed. No
  lettering, no markings, no numerals, no people.

# gen_stills.py reads `exterior_spine` unconditionally. This record has no
# exteriors; the key points at the one spine so the script can start.
exterior_spine: *spine

# --- Motion tails -----------------------------------------------------------

# Dust in the air: the passages, the grille, the lamp beam. The geometry holds
# and only the fine material moves.
motion_tail_air: &motion_tail_air >
  Only the fine dust in the air moves, slowly and evenly, and it keeps moving
  for the whole shot. Every surface, pipe and edge keeps exactly its shape and
  position. The camera itself does not move at all: no dolly, no push in, no
  pull back, no pan, no tilt, no parallax. No cuts, no speed changes, no zoom
  snaps. Nothing enters the frame.

# A rigid part on its mounting: the needle, the wheel, the disc, the rotor,
# the paper strip, the pencil, the bubble, the bar. One degree of freedom the
# model recognises; the shape never changes, only its position or extent.
motion_tail_mech: &motion_tail_mech >
  The one movement named above happens slowly and steadily, and the moving
  part keeps exactly its shape the whole time. Nothing else in the frame
  moves or changes: the housing, the glass and the steel around it stay
  exactly as they are. The camera itself does not move at all: no dolly, no
  push in, no pull back, no pan, no tilt, no zoom. No cuts, no speed changes.
  Nothing enters the frame.

# Light only: a shadow edge, a lamp pulsing, a phosphor field. Nothing solid
# moves.
motion_tail_light: &motion_tail_light >
  Only the light changes, slowly and evenly, for the whole shot. Every object
  and surface keeps exactly its shape and position, and nothing solid moves.
  The camera itself does not move at all: no dolly, no push in, no pull back,
  no pan, no tilt, no parallax, no zoom. No cuts, no speed changes. Nothing
  enters the frame.

# --- Anchors ----------------------------------------------------------------
# Five, one per camera distance that recurs. 7.1 and 8.2 reference approved
# stills (6.3 and 1.2), not an anchor.

anchors:
  - id: A1-wide
    model: anchor
    approved_seed: 22         # approved 2026-10-05, pass 2
    approved_file: anchors/A1-wide.jpg
    covers: ["1.1", "2.4", "4.4", "5.4", "6.2", "8.1"]
    note: >
      Pass 1 (seeds 11/22/33, all rejected): switch banks down both sides in
      every seed, so the card corner is never empty; s22 also grew small label
      plates. Pass 2 changes one property: the switches go to the right side
      only and the left side is described as a plain wall over a bare floor.

      Pass 2: s22 approved. Left wall and floor bare, card corner empty,
      one bank of switches on the right. s11 laid a sheet of labelled tags on
      the floor in the card corner; s33 turned the far end into an open empty
      cabinet. Known faults, accepted: the camera sits low and close, so the
      space reads as a tight cab rather than full depth; pastel blue, taken
      out in the grade.
    spine: *spine
    subject: >
      Camera: 28mm lens at chest height, level, wide, everything in focus.
      Subject: a cramped equipment compartment of painted steel seen across
      its full depth, a bank of identical grey toggle switches along the
      right side only, every switch in the same position and the metal
      around them dark. The left side is one plain unbroken painted wall with
      nothing mounted on it, and the floor in front of it is one bare empty
      steel panel. Every surface is matte and worn to bare metal at the
      edges. The air is completely clear and nothing is loose or hanging. The
      lower left quarter of the frame is that plain wall and bare floor and
      nothing else, because that is where the data cards are drawn.

  - id: A2-passage
    model: anchor
    approved_seed: 11         # approved 2026-10-05, pass 1
    approved_file: anchors/A2-passage.jpg
    note: >
      Pass 1: s11 approved. Dark overhead, the far end falling to black, strong recession. s22 and s33 opened the top of the passage to a bright sky and read as an outdoor trench. Known fault, accepted: pastel blue paint rather than blue-grey, taken out in the grade.
    covers: ["1.3", "3.3", "5.5", "6.1", "8.4"]
    spine: *spine
    subject: >
      Camera: 24mm lens centred in a long narrow passage of painted steel,
      level, looking straight down its length, the vanishing point in the
      middle of the frame. Insulated pipe runs clipped flush along both
      sides, the far end two stops darker than the near end. The air is
      completely clear and nothing is loose or hanging. The lower left
      quarter of the frame is empty painted steel.

  - id: A3-macro
    model: anchor
    approved_seed: 33         # approved 2026-10-05, pass 1
    approved_file: anchors/A3-macro.jpg
    note: >
      Pass 1: s33 approved. No numerals in any seed — the plain-tick wording held. Two faults across all three: "scratched glass" came back cracked, and a ring of twelve ticks reads as a wall clock. s33 has the finer tick ring and an inner circle, which reads as an instrument; its cracks are light and are accepted as wear. 8.2 inherits them through ref_shot on 1.2.
    covers: ["1.2", "2.3", "2.5", "3.2", "3.4", "4.1", "4.3", "4.5", "5.1",
             "5.3", "6.4"]
    spine: *spine
    subject: >
      Camera: 100mm macro lens, the subject filling the frame edge to edge.
      Subject: a round instrument with a brushed steel bezel and a scratched
      glass cover set into a painted steel panel, its face a ring of plain
      engraved tick marks and one fine black needle, the steel around it worn
      to bare metal at the edges. Shallow depth of field, the background two
