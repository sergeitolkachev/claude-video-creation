# --- Shots ------------------------------------------------------------------
#
# `approved_seed` is filled at stage 5. Fifteen shots are ffmpeg: ten carry a
# card and five are texture under narration. No two of them are adjacent
# anywhere in the record.

shots:

  # SCENE 1 — COLD OPEN (30 s)
  #
  # Image first. The slug types into the lower left of 1.1 and is gone by
  # 4.5 s; the cabin card follows it into the same corner, ahead of its line.

  - id: "1.1"
    scene: 1
    approved_seed: 22    # selected 2026-10-05
    motion_tier: static
    timeline_seconds: 10
    source: ffmpeg_still
    motion: static
    card: cabin
    anchors: [A1-wide]
    prompt: >
      A cramped equipment compartment of painted steel seen wide at chest
      height, a bank of identical grey toggle switches along the right side
      with every switch in the same position and the metal around them dark,
      flat blue-white light, the air in front of the subject completely clear,
      nothing in the frame loose or hanging, the lower left of the frame an
      empty bare floor panel, no people

  - id: "1.2"
    scene: 1
    approved_seed: 22    # selected 2026-10-05
    motion_tier: model
    timeline_seconds: 10
    model: workhorse
    generate_seconds: 10
    # The take turned the dial into a clock: past ~4 s the needle swings from
    # two o'clock to twelve and grows a second hand. The first 5 s are clean.
    # Those 5 s are slowed 2x by motion interpolation to fill the 10 s shot,
    # which also turns the needle's sweep into the creep the shot asked for.
    # Serge approved the interpolated version against a frame-repeat one on
    # 2026-10-05; repeated frames step the needle, interpolated ones do not.
    retime: 2.0
    retime_mode: interpolate
    retime_exception: >
      Approved by eye, record 07. Above the 1.3x rule because the only clean
      part of the take is its first half. Verticals cut from takes/ at real
      speed, so any vertical using 1.2 must stay inside its first 4 s.
    motion: the needle creeping a fraction of a tick and settling
    motion_tail: motion_tail_mech
    video_prompt: >
      The fine black needle creeps a fraction of one tick to the right and
      settles there. The camera does not move.
    negative_extra: >
      needle spinning, needle bending, second needle, numbers appearing,
      glass cracking, reflections moving
    anchors: [A3-macro]
    prompt: >
      Extreme close view of a round instrument set into a painted steel
      panel, a ring of plain engraved tick marks under a scratched glass
      cover, one fine black needle, a brushed steel bezel worn to bare metal,
      flat cold light raking across the bezel from the left, background two
      stops darker and unresolvable, no people

  - id: "1.3"
    scene: 1
    approved_seed: 11    # selected 2026-10-05
    motion_tier: model
    timeline_seconds: 10
    model: workhorse
    generate_seconds: 10
    motion: fine dust drifting through the light halfway along the passage
    motion_tail: motion_tail_air
    video_prompt: >
      Fine dust drifts slowly through the flat blue-white light halfway along
      the passage. The camera does not move.
    negative_extra: >
      fog, smoke, steam, lens dust, specks on the lens, people, doors opening
    anchors: [A2-passage]
    prompt: >
      A long narrow passage of painted steel seen straight down its length,
      vanishing point centred, insulated pipe runs clipped flush along both
      sides, fine dust in the flat blue-white light halfway along, cold low
