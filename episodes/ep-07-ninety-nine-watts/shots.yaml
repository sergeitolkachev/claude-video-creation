  - id: A4-top
    model: anchor
    approved_seed: 33         # approved 2026-10-05, pass 1
    approved_file: anchors/A4-top.jpg
    note: >
      Pass 1: s33 approved. One seam across the upper third, lower left empty steel. s11 grew a camera lens and a panel in the card corner; s22 a tray in the card corner. Known fault, accepted: the steel is glossy with a broad specular sheen where the spine asked for matte.
    covers: ["2.2", "3.5", "5.2", "6.5", "8.3", "8.5"]
    spine: *spine
    subject: >
      Camera directly overhead, pointing straight down, the sensor parallel
      to the surface, evenly sharp from edge to edge. Subject: a plain
      brushed steel desk surface, matte and worn pale along its edges, one
      straight seam across the upper third. Every part of the picture is that
