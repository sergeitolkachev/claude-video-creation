episode: ep-10-the-ceiling
runtime_seconds: 270
aspect: "16:9"

# The channel narrator, third person (script.md header).
voice: narrator

scene_runtime: {1: 34, 2: 36, 3: 40, 4: 36, 5: 32, 6: 32, 7: 30, 8: 30}

# Scene 8 is cards, the radar sweeping and a pull back. No voice
# (script.md, Scene 8 — declared coda).
coda: [8]

# Prompt hygiene, checked by validate.py. Re-cut for a dry salt basin under a
# hard sun: no water moves anywhere in this record, nothing is lit but the
# sun, and the only things that move are the animal, the radar, the
# anemometer and the barograph drum.
hygiene:
  allow_grainy: []
  allow_hand: []
  forbid:
    - pattern: '\b(drift\w*|float\w*|motes?|dust\w*|suspended|vapou?r|mist|steam|smoke|haze|shimmer\w*|drips?|dripping|beads?|particles?|specks?|moving|moves|turning|turns|swings?|swinging|blinks?|blinking|slides?|sliding|travel\w*|rotat\w*|spin\w*|sinks?|sinking|eases?|glid\w*|flight|flying|pumps?|pumping|lowers|lowering|lift\w*)\b'
      except: ["1.1", "1.4", "2.3", "3.4", "4.1", "5.1", "5.4",
               "6.1", "6.4", "7.3"]
      why: >
        A shot built from one still must contain nothing the eye expects to
        see move (record 04's twelve plates; record 05's rule). Heat haze is
        in the list because a basin under a hard sun invites it and a frozen
        shimmer reads as a stalled player. Only the model shots name motion;
        the static and local plates say "everything at rest" instead of
        "nothing moving", because the negation is caught here too.

    - pattern: '\b(text|lettering|writing|written|label\w*|plaque|placard|nameplate|stencil\w*|serial|legible|numerals?|digits?|figures?|readout|markings?|scale|counter|display|screen|monitor|sign\w*)\b'
      except: []
      why: >
        Every character on this channel comes out of build_cards.py, and on
        paper out of build_paper.py. The noun alone summons lettering.

    - pattern: '\b(gauge|dial|needle)\b'
      except: []
      why: >
        No instrument face in this record. The barograph is a drum and a pen
        arm on blank paper, and the radar has no screen in frame.

    - pattern: '\b(lamp|lantern|bulb|torch|flashlight|spotlight|headlamp|indicator|led)\b'
      except: []
      why: >
        The only light in the record is the sun, and later a grey sky.

    - pattern: '\b(amber|orange|yellow|gold\w*|tungsten|sodium|candle\w*|fire|sunset|sunrise|dusk|dawn|green|red|blue)\b'
      except: []
      why: >
        Salt white, bone, basalt black, a pale milky turquoise, dull bronze.
        Green belongs to the cards alone. Record 02 walked a salt pan under a
        low sun; this one is high noon, so no low-sun words at all.

    - pattern: '\b(water\w* (ripples?|waves?)|ripples?|waves?|splash\w*|film|sheen|wet)\b'
      except: []
      why: >
        Water in this record is a still, glassy lake and nothing else. A
        sheen is not a thing a model can move (record 08), and here nothing
        asks it to.

    - pattern: '\b(person|people walking|human|figure|hands?|fingers?|gloves?|boots?|footprints?|tracks in the salt|vehicle|tent|camp)\b'
      except: []
      why: >
        The survey team is never seen, nor anything they leave on the ground.
        "No people" ends prompts and is not matched here.

    - pattern: '\b(card|plate|plates|caption|title|overlay)\b'
      except: []
      why: >
        Which shots carry a card is cards.yaml's business. Salt crust is
        "polygons", not "plates", for the same reason.


# --- Spines -----------------------------------------------------------------
# Material, light and palette only (script.md, Basin spine / Macro spine).
# Neither names the lake, the animal or any instrument, and neither carries a
# camera word. gen_stills.py reads the top-level exterior_spine for text-only
# shots, so it is the basin spine under that key.

# Pass 2 (2026-11-04): pass 1 put a dead log in 11 of 12 basin, kit and
# ground candidates — "sun-bleached grey dead wood" is a noun, and a spine
# may not name an object (CLAUDE.md). And "dull bronze" came back as a rust
# band along the lake shore; bronze belongs to the animal, so it is in the
# macro spine only. A1 s22 also drew a person on the shore.
spine: &spine >
  Crusted white salt and broken black basalt under a hard white sun high
  overhead in a pale white sky, the air completely clear and dry so that
  distance does not soften anything, shadows short and black. Everything
  matte, dry and bleached, the salt pure white right to the water. One
  palette throughout: salt white, bone, basalt black, a pale milky turquoise.
  No people, no vehicles, no buildings, no lettering, no markings.

exterior_spine: *spine

# For the grey-sky plates generated text-only (7.2). Same materials and
# palette as the basin spine; only the light changes.
overcast_spine: >
  Crusted white salt and broken black basalt under a low flat grey overcast
  sky, the light dull, even and shadowless, the air completely clear and dry.
  Everything matte, dry and bleached. One palette throughout: salt white,
  bone, basalt black, dull grey. No people, no vehicles, no buildings, no
  lettering, no markings.

macro_spine: &macro_spine >
  Hard white sunlight from high and to one side, deep black shadow on the far
  side of every form, a background of pale salt glare falling far out of
  focus. Every surface matte and dry: salt crystals, bleached grey wood grain,
  dull lacquered bronze worn to black at the edges. One palette throughout:
  salt white, bone, basalt black, dull bronze. No people, no lettering, no
  markings.

negative_base: >
  fast motion, camera shake, dolly, push in, pull back, pan, tilt, zoom,
  morphing geometry, objects changing shape, new objects appearing,
  the whole frame brightening or darkening, heat haze, shimmer, blur,
  distortion, low quality, people, hands, faces, text, lettering, numerals,
  watermark

# Every model shot of the animal adds this (record 04: Kling completes an
# animal and invents what the still withholds).
animal_negative: &animal_negative >
  the head turning towards camera, eyes, a face, extra legs, a second pair of
  wings, wings beating fast, wings flapping, a blur of wingbeats, the insect
  taking off, the insect flying away, the body growing, the body morphing,
  the abdomen bending or curling, the branch bending, a second insect
  appearing


# --- Motion tails -----------------------------------------------------------
# Kling 3.0 does not stop a motion (CLAUDE.md): every model shot is a motion
# that runs for the whole clip.

motion_tail_steady: &motion_tail_steady >
  The movement named above runs steadily for the whole shot, starting in the
  first second. Everything else in the frame is still and rigid and keeps
  exactly its shape. The camera does not move at all: no dolly, no push in,
  no pull back, no pan, no tilt, no zoom. No cuts, no speed changes. Nothing
  enters the frame.

motion_tail_glide: &motion_tail_glide >
  Only the one insect moves, gliding at a slow even speed with its wings held
  flat and rigid; the landscape is completely still. The camera does not
  move. No cuts, no speed changes. Nothing else enters the frame.


# --- Anchors ----------------------------------------------------------------
# One per camera distance that recurs. Six, not five: the card plates are
# salt ground seen from standing height, a distance the basin wide (A1) would
# drag out to a landscape and the macro (A3) would drag in to a crystal.

anchors:
  - id: A1-basin
    model: anchor
    approved_seed: 11         # approved by Serge 2026-11-04, pass 2
    approved_file: anchors/A1-basin.jpg
    covers: ["1.2", "4.1", "4.2", "6.3", "7.1", "8.4", "8.5"]
    spine: *spine
    subject: >
      Camera: 28mm lens at standing height high on a black basalt slope,
      looking down across white salt to a flat lake of pale milky turquoise
      edged with a broad white crust, the far wall of broken black basalt
      rising to a straight level rim against a white sky. The lake surface is
      flat and glassy. Hard sun overhead, short black shadows.

  - id: A2-animal
    model: anchor
    approved_seed: 22         # approved by Serge 2026-11-04, pass 2
    approved_file: anchors/A2-animal.jpg
    covers: ["1.1", "3.4"]
    spine: *macro_spine
    # Pass 2: pass 1 hung all three candidates from a metal hook on a short
    # wire, like a pinned specimen — "hooked forelegs" was read as a hook.
    # Now the legs grip the bark, and the branch gives the scale.
    subject: >
      Camera: 85mm lens, slightly below and in front, a single very large
      dragonfly-like insect clinging to the underside of a thick split grey
      dead branch, its six thin legs gripping the bark directly, its body
      hanging vertically below the branch, its whole length in frame, each
      of its four broad wings about four times longer than the branch is
      thick, the wings of smoked glass with a fine black lattice of veins
      spread flat and level to both sides, the long abdomen dull lacquered
      bronze worn black at the joints, the head tucked up against the branch
      in deep shadow, pale salt glare far out of focus behind.

  - id: A3-macro
    model: anchor
    approved_seed: 22         # approved by Serge 2026-11-04, pass 1
    approved_file: anchors/A3-macro.jpg
    covers: ["2.1", "2.4", "3.1", "5.4"]
    spine: *macro_spine
    subject: >
      Camera: 100mm macro lens, one wing panel of a large insect filling the
      frame edge to edge, a membrane like smoked glass divided by a dense
      black lattice of veins into hundreds of small cells, hard sun from
      behind so the membrane glows pale bronze, the background unresolvable
      pale glare.

  - id: A4-kit
    model: anchor
    approved_seed: 33         # approved by Serge 2026-11-04, pass 2
    approved_file: anchors/A4-kit.jpg
    covers: ["1.4", "2.3", "6.1"]
    spine: *spine
    subject: >
      Camera: 50mm lens, head-on at waist height, a small field radar head on
      a steel tripod standing on white salt crust, a shallow matte grey dish
      on a short vertical mast, its casing plain grey and scuffed bare at the
      corners, centred in frame, the pale turquoise lake and the black far
      wall soft behind.

  - id: A5-notebook
    model: anchor
    approved_seed: 22         # approved by Serge 2026-11-04, pass 1
    approved_file: anchors/A5-notebook.jpg
    covers: ["4.4"]
    spine: *macro_spine
    subject: >
      Flat lay photograph taken from directly above, camera pointing straight
