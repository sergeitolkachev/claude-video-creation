  - id: A6-ground
    model: anchor
    approved_seed: 33         # approved by Serge 2026-11-04, pass 2
    approved_file: anchors/A6-ground.jpg
    covers: ["1.3", "2.2", "3.3", "4.3", "5.2", "6.2", "7.2", "8.1", "8.3"]
