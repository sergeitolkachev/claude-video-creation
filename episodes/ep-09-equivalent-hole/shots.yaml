episode: ep-09-equivalent-hole
runtime_seconds: 270
aspect: "16:9"

# Told by the operator, first person.
voice: character

scene_runtime: {1: 34, 2: 36, 3: 30, 4: 40, 5: 44, 6: 30, 7: 26, 8: 30}

# Scene 8 is cards and two running shots, no voice (script.md, Scene 8).
coda: [8]

# Prompt hygiene, checked by validate.py. Same intent as record 08's list,
# re-cut for a weightless station: a frame that is never animated may contain
# nothing that would be moving, floating or lit.
hygiene:
  allow_grainy: []
  allow_hand: []
  forbid:
    - pattern: '\b(drift\w*|float\w*|motes?|dust|suspended|vapou?r|mist|steam|smoke|condensation|drips?|dripping|beads?|particles?|specks?|moving|moves|turning|turns|swings?|swinging|blinks?|blinking|slides?|sliding|travel\w*|rotat\w*|sinks?|sinking|eases?)\b'
      except: ["1.1", "1.2", "2.1", "2.4", "3.1", "3.4", "4.1", "4.4",
               "5.2", "5.5", "6.3", "7.1", "7.2", "8.2", "8.4"]
      why: >
        A shot built from one still must contain nothing the eye expects to
        see move (record 04's twelve plates; record 05's rule). Only the
        model shots name motion. "Nothing loose, floating or hanging" in the
        static plates is a negation the hygiene would also catch, so those
        plates say it as "every strap flat and buckled" instead.

    - pattern: '\b(text|lettering|writing|written|label\w*|plaque|placard|nameplate|stencil\w*|serial|legible|numerals?|digits?|figures?|readout|markings?|scale|counter|display|screen|monitor)\b'
      except: []
      why: >
        Every character on this channel comes out of build_cards.py. The
        noun alone summons lettering.

    - pattern: '\b(gauge|dial|needle)\b'
      except: ["4.1", "5.5"]
      why: >
        The one instrument face in the record is the module C gauge: five
        plain ticks, a short arc, no numerals. Anywhere else a gauge is an
        invitation to invent a scale.

    - pattern: '\b(lamp|lantern|bulb|torch|flashlight|spotlight|headlamp|indicator)\b'
      except: ["1.1", "4.4"]
      why: >
        A lamp named in a spine reaches eight anchors of fifteen (record 03).
        Two shots carry a small status lamp that blinks, and nowhere else.

    - pattern: '\b(warm|amber|orange|yellow|gold\w*|tungsten|sodium|candle\w*|fire|green|red)\b'
      except: []
      why: >
        Bone, aluminium grey, cold blue. Green belongs to the cards alone.
        The pencil is grey for the same reason.

    - pattern: '\b(person|human|figure|hands?|fingers?|gloves?|astronaut|crew|suit)\b'
      except: []
      why: >
        One operator, never seen. "No people" ends prompts and is not
        matched here.

    - pattern: '\b(card|plate|caption|title|overlay)\b'
      except: []
      why: >
        Which shots carry a card is cards.yaml's business.


# --- Spines -----------------------------------------------------------------
# Material, light and palette only. "Panelling", not "module" or "interior",
# so the macro anchor is not dragged into a room (record 03).

spine: &spine >
  Bone-coloured fabric-covered panelling and brushed aluminium, worn soft and
  greyed along every edge that gets touched, faint scuffs and old adhesive
  marks, matte, nothing polished and nothing new. One palette throughout:
  bone, aluminium grey, cold blue. The light is flat, cool and diffuse with no
  visible source. Contrast is low, shadows soft and shallow, blacks lifted and
  never crushed. No lettering, no markings, no numerals, no people.

macro_spine: &macro_spine >
  A macro photograph of brushed aluminium and bone-coloured fabric, worn soft
  at every edge, matte, nothing polished and nothing new. One palette: bone,
  aluminium grey, cold blue. Flat cool diffuse light, low contrast, the
  background falling off to soft grey-blue. No lettering, no markings, no
  numerals, no people.

exterior_spine: &exterior_spine >
  Open space. Aluminium and thermal blanket weathered to a dull ivory, seams
  and fastener rows catching hard sunlight from one side, the shadow side
  falling to near black. Black sky, the Earth below in blue and pale cloud.
  One palette: ivory, aluminium grey, cold blue, black. No lettering, no
  markings, no numerals, no flags, no people.

# "flicker" is not in this list: 1.1 and 4.4 are lamps asked to blink, and a
# negative that forbids the motion argues with the shot (dry run, 2026-10-26).
negative_base: >
  fast motion, camera shake, dolly, push in, pull back, pan, tilt, zoom,
  morphing geometry, objects changing shape, new objects appearing,
  the whole frame brightening or darkening, blur, distortion, low quality,
  people, hands, faces, text, lettering, numerals, watermark


# --- Motion tails -----------------------------------------------------------

motion_tail_event: &motion_tail_event >
  The one movement named above happens at a steady unhurried speed, starting
  in the first second. Everything else in the frame is still and rigid and
  keeps exactly its shape. The camera does not move at all: no dolly, no push
  in, no pull back, no pan, no tilt, no zoom. No cuts, no speed changes.
  Nothing enters the frame.

motion_tail_steady: &motion_tail_steady >
  The movement named above runs steadily for the whole shot, starting in the
  first second. Everything else in the frame is still and rigid. The camera
  does not move at all: no dolly, no push in, no pull back, no pan, no tilt,
  no zoom. No cuts, no speed changes. Nothing enters the frame.

motion_tail_earth: &motion_tail_earth >
  Only the Earth's surface moves, sliding slowly and steadily beneath, clouds
  keeping their shapes as they travel. The station and everything attached to
  it are completely still. The camera does not move. No cuts, no speed
  changes. Nothing enters the frame.


# --- Anchors ----------------------------------------------------------------
# One per camera distance that recurs. A5 is an exterior and is generated
# from text with the exterior spine; no interior anchor is passed to 3.1/6.2.

anchors:
  - id: A1-module
    model: anchor
    approved_seed: 11         # approved by Serge 2026-10-26, pass 1
    approved_file: anchors/A1-module.jpg
    covers: ["1.3", "2.2", "3.4", "4.2", "5.3", "6.1", "7.3", "8.1", "8.5"]
    spine: *spine
    subject: >
      Camera: 24mm lens at chest height inside a long cylindrical pressurised
      module, looking along its full length, the vanishing point near the
      centre of the frame. Bone-coloured fabric-covered panels line the curved
      walls, brushed aluminium handrails run along them, every stowage strap
      is pulled flat and buckled, a round closed hatch at the far end. The air
      is completely clear. The lower left quarter of the frame is a plain
      empty wall panel.

  - id: A2-macro
    model: anchor
    approved_seed: 11         # approved by Serge 2026-10-26, pass 1
    approved_file: anchors/A2-macro.jpg
    covers: ["1.1", "2.4", "4.1", "4.4", "7.1"]
    spine: *macro_spine
    subject: >
      Camera: long lens, extreme close view of a small round brushed
      aluminium fitting set into a bone-coloured fabric panel, the fitting
      filling the centre of the frame, a braided line leaving it to one side,
      every surface worn soft at the edges, the background two stops darker
      and unresolvable.

  - id: A3-headon
    model: anchor
    approved_seed: 33         # approved by Serge 2026-10-26, pass 1
    approved_file: anchors/A3-headon.jpg
    covers: ["1.2", "2.1", "2.3", "5.1", "5.2"]
    spine: *spine
    subject: >
      Camera: normal lens, flat frontal view of a round pressure hatch set in
      a bone-coloured panelled bulkhead, the hatch centred, a thick aluminium
      door on one heavy hinge on the left, a central handwheel with a plain
      ribbed rim, a dark rubber seal around the frame, a plain panelled
      surface around it on every side.

  - id: A4-topdown
    model: anchor
    approved_seed: 11         # approved by Serge 2026-10-26, pass 2
    approved_file: anchors/A4-topdown.jpg
    covers: ["1.4", "3.2", "4.3", "8.3"]
    spine: *spine
    note: >
      Pass 1 (s11/s22/s33, all rejected 2026-10-26): every candidate drew a
      fold-down table seen from the front at eye height, with the wall behind
      it — "set into a panel" read as a wall, and the camera followed it.
      Pass 2 describes a flat lay: the surface fills the frame edge to edge
      and there is no wall, no edge and no horizon to put a camera in front
      of.
    subject: >
      Flat lay photograph taken from directly above, camera pointing straight
      down. A sheet of brushed aluminium fills the entire frame edge to edge,
      its brushing running left to right, worn and lightly scratched, with no
      edge, wall or horizon visible anywhere. A closed dark logbook lies flat
      in the upper right of the frame, held under a plain steel clip bar
      screwed to the aluminium. Even, flat, cool light with no shadows. The
      lower left half of the frame is bare brushed aluminium.

  - id: A5-exterior
    model: anchor
    approved_seed: 33         # approved by Serge 2026-10-26, pass 1
    approved_file: anchors/A5-exterior.jpg
    exterior: true
    covers: ["3.1", "6.2"]
    spine: *exterior_spine
    subject: >
      Camera: wide lens in open space beside an orbital station, a
      cylindrical module of ivory thermal blanket and aluminium crossing the
      upper third of the frame lit hard from the left, its right half in
      deep shadow, the Earth filling the lower half of the frame with bands
      of pale cloud over blue ocean, black sky above.


